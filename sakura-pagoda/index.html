<title>Sakura Pagoda · Voxel Garden</title>
<!--
  Sakura Pagoda — a procedurally generated voxel garden.
  Single self-contained file: open it in Chrome (needs internet to fetch three.js from jsDelivr).
  Controls: drag = orbit, scroll = zoom, right-drag = pan.
  Keys: 1-4 time presets · R orbit · P petals · C day cycle · H hide UI
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
  :root {
    --ink: #ffffff;
    --glass: rgba(22, 16, 38, 0.40);
    --line: rgba(255, 255, 255, 0.18);
    --accent: #ff9ec4;
    --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: linear-gradient(#4f86d6, #d6eaff);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #app canvas { touch-action: none; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 75% 70% at 50% 46%, transparent 58%, rgba(12, 6, 32, 0.34) 100%);
  }

  /* ---------- title ---------- */
  #title {
    position: fixed; top: 24px; left: 28px; pointer-events: none;
    text-shadow: 0 1px 2px rgba(20, 10, 40, 0.45), 0 0 18px rgba(20, 10, 40, 0.25);
    transition: opacity 0.6s ease;
  }
  #title .jp { font-family: var(--serif); font-weight: 800; font-size: 36px; letter-spacing: 0.14em; line-height: 1.1; }
  #title .en { font-size: 12px; font-weight: 600; letter-spacing: 0.46em; text-transform: uppercase; margin-top: 6px; opacity: 0.95; }
  #title .sub { font-family: var(--serif); font-size: 14px; margin-top: 8px; opacity: 0.88; }
  #stats { font-size: 11px; margin-top: 10px; opacity: 0.7; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }

  /* ---------- dock ---------- */
  #dock {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px; padding: 7px;
    border-radius: 999px; background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(16px) saturate(1.35); -webkit-backdrop-filter: blur(16px) saturate(1.35);
    box-shadow: 0 10px 30px rgba(10, 6, 30, 0.28);
    transition: opacity 0.6s ease;
    max-width: calc(100vw - 32px);
  }
  #dock .group { display: flex; align-items: center; gap: 2px; }
  #dock .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  #dock button {
    appearance: none; border: 0; background: transparent; color: var(--ink);
    font: 500 13px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 9px 13px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background 0.2s ease, color 0.2s ease;
  }
  #dock button svg { width: 15px; height: 15px; flex: none; }
  #dock button:hover { background: rgba(255, 255, 255, 0.14); }
  #dock button.on { background: rgba(255, 255, 255, 0.92); color: #2b1d3f; }
  #dock button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #dock .slider { gap: 10px; padding: 0 6px; }
  #time { width: 150px; accent-color: var(--accent); cursor: pointer; }
  #clock { font-variant-numeric: tabular-nums; font-size: 13px; min-width: 40px; opacity: 0.92; }

  #hint {
    position: fixed; right: 26px; top: 26px; font-size: 11.5px; line-height: 1.6; text-align: right;
    opacity: 0.75; pointer-events: none; text-shadow: 0 1px 2px rgba(20, 10, 40, 0.5);
    transition: opacity 0.6s ease;
  }
  #hint kbd { font: 600 10.5px system-ui, sans-serif; padding: 1px 5px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.4); }

  body.hide-ui #title, body.hide-ui #dock, body.hide-ui #hint { opacity: 0; pointer-events: none; }
  body.hide-ui #dock * { pointer-events: none; }

  /* ---------- loader ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 42%, #fff1f6 0%, #f7cfe1 32%, #c9a7dd 70%, #8c79c4 100%);
    color: #4a2b4f; transition: opacity 1.4s ease;
  }
  body.ready #loader { opacity: 0; pointer-events: none; }
  #loader .inner { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 24px; }
  #loader svg { width: 92px; height: 92px; animation: spin 9s linear infinite; filter: drop-shadow(0 6px 14px rgba(160, 60, 110, 0.3)); }
  #loader .t { font-family: var(--serif); font-weight: 800; font-size: 30px; letter-spacing: 0.16em; }
  #loader .t small { display: block; font-family: system-ui, sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.5em; margin-top: 6px; opacity: 0.7; }
  #load-msg { font-size: 13px; opacity: 0.85; min-height: 1.4em; max-width: 420px; }
  .track { width: 230px; height: 3px; border-radius: 3px; background: rgba(74, 43, 79, 0.16); overflow: hidden; }
  #load-bar { height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, #ff8fb8, #c56bd6); transition: width 0.45s ease; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 760px) {
    #title { top: 16px; left: 16px; }
    #title .jp { font-size: 26px; }
    #title .sub, #stats { display: none; }
    #dock { flex-wrap: wrap; justify-content: center; border-radius: 22px; bottom: 14px; width: calc(100vw - 32px); }
    #dock .sep { display: none; }
    #time { width: 120px; }
    #hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { #loader svg { animation: none; } }
</style>

<script>

  setTimeout(function () {

    if (!window.__pagoda && m) m.textContent = 'Still loading… this page fetches three.js from jsDelivr, so it needs an internet connection and a WebGL2-capable browser.';
  }, 15000);

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// =============================================================================
//  VOXEL WORLD — procedural generation + meshing (plain JS, no dependencies)
// =============================================================================
const SOLID = 1, GLOW = 2, WATER = 3, GLOW_SOFT = 4;   // material ids (top byte of each voxel)
const SX = 176, SY = 160, SZ = 176;        // world grid size (voxels)
const CX = 88, CZ = 88;                    // island centre
const G = 48;                              // ground layer (grass voxels sit at y = G)
const IR = 72;                             // island radius

// ---------- seeded random ----------------------------------------------------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rand = mulberry32(1);
const reseed = (s) => { rand = mulberry32(s); };
const RR = (a, b) => a + (b - a) * rand();
const RI = (a, b) => Math.floor(a + (b - a + 1) * rand());
const pick = (arr) => arr[Math.floor(rand() * arr.length)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;

// ---------- hashing & value noise -------------------------------------------
function hash2(x, y) {
  let h = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function hash3(x, y, z) {
  let h = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(z | 0, 0x9e3779b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function vnoise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const l = (a, b, t) => a + (b - a) * t;
  return l(
    l(l(hash3(xi, yi, zi), hash3(xi + 1, yi, zi), u), l(hash3(xi, yi + 1, zi), hash3(xi + 1, yi + 1, zi), u), v),
    l(l(hash3(xi, yi, zi + 1), hash3(xi + 1, yi, zi + 1), u), l(hash3(xi, yi + 1, zi + 1), hash3(xi + 1, yi + 1, zi + 1), u), v),
    w);
}
function fbm2(x, y, o = 4) {
  let s = 0, a = 1, n = 0, f = 1;
  for (let i = 0; i < o; i++) { s += a * vnoise2(x * f + i * 17.3, y * f - i * 9.1); n += a; a *= 0.5; f *= 2.03; }
  return s / n;
}
function fbm3(x, y, z, o = 3) {
  let s = 0, a = 1, n = 0, f = 1;
  for (let i = 0; i < o; i++) { s += a * vnoise3(x * f + i * 7.7, y * f - i * 3.1, z * f + i * 5.3); n += a; a *= 0.5; f *= 2.03; }
  return s / n;
}

// ---------- colour helpers (packed 0xRRGGBB, sRGB) ----------------------------
const cl8 = (v) => (v < 0 ? 0 : v > 255 ? 255 : v | 0);
function jit(c, a = 0.06) {
  const f = 1 + (rand() * 2 - 1) * a;
  return (cl8(((c >> 16) & 255) * f) << 16) | (cl8(((c >> 8) & 255) * f) << 8) | cl8((c & 255) * f);
}
function mixc(a, b, t) {
  const ar = (a >> 16) & 255, ag = (a >> 8) & 255, ab = a & 255;
  return (cl8(ar + (((b >> 16) & 255) - ar) * t) << 16) | (cl8(ag + (((b >> 8) & 255) - ag) * t) << 8) | cl8(ab + ((b & 255) - ab) * t);
}
const mulc = (c, f) => (cl8(((c >> 16) & 255) * f) << 16) | (cl8(((c >> 8) & 255) * f) << 8) | cl8((c & 255) * f);
const waterCol = (foam, depth) => (cl8(foam * 255) << 16) | (cl8(depth * 255) << 8);

// ---------- small vector helpers ---------------------------------------------
const vadd = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const vmul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const vnorm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
function vbasis(d) {
  const up = Math.abs(d[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
  const u = vnorm([d[1] * up[2] - d[2] * up[1], d[2] * up[0] - d[0] * up[2], d[0] * up[1] - d[1] * up[0]]);
  const v = [d[1] * u[2] - d[2] * u[1], d[2] * u[0] - d[0] * u[2], d[0] * u[1] - d[1] * u[0]];
  return [u, v];
}

// =============================================================================
//  Grid
// =============================================================================
class Grid {
  constructor(sx, sy, sz) {
    this.sx = sx; this.sy = sy; this.sz = sz;
    this.d = new Uint32Array(sx * sy * sz);
    this.lamps = [];
  }
  set(x, y, z, c, m = SOLID) {
    x = Math.floor(x); y = Math.floor(y); z = Math.floor(z);
    if (x < 0 || y < 0 || z < 0 || x >= this.sx || y >= this.sy || z >= this.sz) return;
    this.d[(y * this.sz + z) * this.sx + x] = ((m << 24) | (c & 0xffffff)) >>> 0;
  }
  get(x, y, z) {
    x = Math.floor(x); y = Math.floor(y); z = Math.floor(z);
    if (x < 0 || y < 0 || z < 0 || x >= this.sx || y >= this.sy || z >= this.sz) return 0;
    return this.d[(y * this.sz + z) * this.sx + x];
  }
  put(x, y, z, c, m = SOLID) { if (this.get(x, y, z) === 0) this.set(x, y, z, c, m); }
  del(x, y, z) {
    x = Math.floor(x); y = Math.floor(y); z = Math.floor(z);
    if (x < 0 || y < 0 || z < 0 || x >= this.sx || y >= this.sy || z >= this.sz) return;
    this.d[(y * this.sz + z) * this.sx + x] = 0;
  }
  empty(x, y, z) { return this.get(x, y, z) === 0; }
  solid(x, y, z) { const m = this.get(x, y, z) >>> 24; return m !== 0 && m !== WATER; }
  // col: number (jittered) or fn(x,y,z) -> colour | null. mode 1 = only fill empty cells
  box(x0, y0, z0, x1, y1, z1, col, m = SOLID, mode = 0) {
    for (let y = y0; y <= y1; y++) for (let z = z0; z <= z1; z++) for (let x = x0; x <= x1; x++) {
      const c = typeof col === 'function' ? col(x, y, z) : jit(col, 0.04);
      if (c === null || c === undefined || c < 0) continue;
      if (mode === 1) this.put(x, y, z, c, m); else this.set(x, y, z, c, m);
    }
  }
  ball(px, py, pz, r, col, m = SOLID, mode = 0) {
    const r2 = r * r;
    const fn = typeof col === 'function' ? col : () => jit(col, 0.05);
    for (let y = Math.floor(py - r); y <= Math.floor(py + r); y++)
      for (let z = Math.floor(pz - r); z <= Math.floor(pz + r); z++)
        for (let x = Math.floor(px - r); x <= Math.floor(px + r); x++) {
          const dx = x + 0.5 - px, dy = y + 0.5 - py, dz = z + 0.5 - pz;
          if (dx * dx + dy * dy + dz * dz > r2) continue;
          const c = fn(x, y, z); if (c === null || c < 0) continue;
          if (mode === 1) this.put(x, y, z, c, m); else this.set(x, y, z, c, m);
        }
    if (r < 0.9) {
      const c = fn(px, py, pz);
      if (c !== null && c >= 0) { if (mode === 1) this.put(px, py, pz, c, m); else this.set(px, py, pz, c, m); }
    }
  }
  line(x0, y0, z0, x1, y1, z1, r0, r1, col, m = SOLID, mode = 0) {
    const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0, z1 - z0) * 2.5));
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      this.ball(lerp(x0, x1, t), lerp(y0, y1, t), lerp(z0, z1, t), lerp(r0, r1, t), col, m, mode);
    }
  }
  count() { let n = 0; const d = this.d; for (let i = 0; i < d.length; i++) if (d[i]) n++; return n; }
}

// orientation helper: local (forward, up, side) -> world cell, facing 0:+x 1:+z 2:-x 3:-z
function orient(x, y, z, facing) {
  const F = [[1, 0], [0, 1], [-1, 0], [0, -1]][facing], S = [[0, 1], [-1, 0], [0, -1], [1, 0]][facing];
  return (f, u, s) => [x + F[0] * f + S[0] * s, y + u, z + F[1] * f + S[1] * s];
}

// =============================================================================
//  Palettes
// =============================================================================
const PAL = {
  verm: 0xD8432E, vermDark: 0xA9301F, beam: 0xC23A28, woodDark: 0x5A2E1E, wood: 0x8A5A36, plank: 0x9C6B42,
  plaster: 0xF4EFE5, gold: 0xE3B448, goldDeep: 0xC9962E, bronze: 0x5E5448,
  tileA: 0x2F8F80, tileB: 0x247367, ridge: 0x63BCA8, eave: 0xF1E6CC, rafter: 0xA63A2B, rafterDark: 0x77281E,
  paper: 0xFFE2A6, lanternRed: 0xE8432F, stone: 0xA8A398, stoneDark: 0x7E7A72, stoneLight: 0xC9C3B6,
  black: 0x2A2626, bark: 0x4A3631, barkDark: 0x3A2925,
};
const SAKURA = [
  { lo: 0xEE8FB2, hi: 0xFFE3EE, acc: 0xFFFFFF },   // somei-yoshino: pale
  { lo: 0xE0628F, hi: 0xFFB8D0, acc: 0xFF8DB8 },   // kanzan: deep pink
  { lo: 0xEA80A6, hi: 0xFFD2E2, acc: 0xFFF1F6 },   // classic
];
const MAPLE_RED = [0xC62828, 0xD32F2F, 0xB71C1C, 0xE53935, 0xA31A1A, 0xD84315];
const MAPLE_ORANGE = [0xE65100, 0xEF6C00, 0xF57C00, 0xFB8C00, 0xD84315, 0xFFA000];
const GINKGO = [0xFFD54F, 0xFFCA28, 0xFFC107, 0xFFE082, 0xFBC02D, 0xF9A825];

// =============================================================================
//  Island layout
// =============================================================================
const T_GRASS = 1, T_PATH = 2, T_GRAVEL = 3, T_POND = 4, T_STREAM = 5, T_SHORE = 6,
  T_ROCK = 7, T_LITTER = 8, T_FINE = 9, T_CASCADE = 10;

const PAG = { x: CX - 4, z: CZ - 16 };
const MOUNDS = [
  { x: -34, z: 58, r: 10, h: 2 }, { x: -62, z: 26, r: 8, h: 2 }, { x: -25, z: 0, r: 7, h: 1.4 },
  { x: 48, z: -50, r: 8, h: 2 }, { x: -20, z: -54, r: 8, h: 1.6 }, { x: 10, z: -60, r: 8, h: 1.6 },
  { x: 22, z: -42, r: 7, h: 1.6 }, { x: -50, z: 46, r: 6, h: 1.4 }, { x: 40, z: 46, r: 9, h: 1.5 },
];
const ROCK_GROUPS = [{ x: -47, z: 24, r: 3.6 }, { x: -29, z: 34, r: 3.0 }, { x: -36, z: 18, r: 2.4 }, { x: -24, z: 23, r: 1.8 }];

function islandS(x, z) {
  const dx = (x + 0.5 - CX) / IR, dz = (z + 0.5 - CZ) / IR;
  const s = Math.pow(Math.pow(Math.abs(dx), 2.6) + Math.pow(Math.abs(dz), 2.6), 1 / 2.6);
  const a = Math.atan2(dz, dx);
  const e = 1 + 0.04 * Math.sin(3 * a + 0.7) + 0.03 * Math.sin(5 * a + 2.1) + 0.018 * Math.sin(9 * a + 0.3)
    + (fbm2(x * 0.07, z * 0.07, 3) - 0.5) * 0.12;
  return s / e;
}
function pondF(ox, oz) {
  const e1 = 1 - (((ox - 24) / 16) ** 2 + ((oz - 22) / 13) ** 2);
  const e2 = 1 - (((ox - 32) / 11) ** 2 + ((oz - 6) / 10) ** 2);
  return Math.max(e1, e2) + (fbm2(ox * 0.13 + 40, oz * 0.13 + 40, 2) - 0.5) * 0.3;
}
const streamCx = (oz) => 22 + 3 * Math.sin(oz * 0.16);
const rockGardenF = (ox, oz) => 1 - (((ox + 38) / 19) ** 2 + ((oz - 28) / 14.5) ** 2);
const inShrinePath = (ox, oz) => (oz >= -18 && oz <= -14 && ox >= -40 && ox <= -22) || (ox >= -42 && ox <= -38 && oz >= -46 && oz <= -14);
const isPathGap = (ox, oz) => (((oz % 4) + 4) % 4) === 3;

// ---------- surface colours ----------
function grassColor(x, z) {
  const n = fbm2(x * 0.07, z * 0.07, 3);
  let c = mixc(0x4C9632, 0x8FCB55, clamp((n - 0.28) * 2.2, 0, 1));
  const n2 = vnoise2(x * 0.45 + 3, z * 0.45 + 9);
  c = mixc(c, n2 > 0.5 ? 0xA3D366 : 0x3F8A2C, Math.abs(n2 - 0.5) * 0.55);
  return jit(c, 0.07);
}
function pathColor(x, z) {
  const ox = x - CX, oz = z - CZ;
  const row = Math.floor(oz / 4);
  if (isPathGap(ox, oz)) return jit(rand() < 0.35 ? 0x6E8F45 : 0x86817A, 0.06);
  const col = ox + 6; // 0..4
  const split = 1 + Math.floor(hash2(row, 7) * 3);
  if (col === split && hash2(row, 3) > 0.45) return jit(0x8A857C, 0.05);
  const id = col < split ? 0 : 1;
  const base = [0xCBC4B6, 0xBAB3A4, 0xD5CFC1, 0xB0A99B][Math.floor(hash2(row, id + 11) * 4)];
  return jit(base, 0.025);
}
function gravelColor(x, z) {
  const ox = x - CX + 0.5, oz = z - CZ + 0.5;
  let best = 1e9;
  for (const r of ROCK_GROUPS) best = Math.min(best, Math.hypot(ox - r.x, oz - r.z) - r.r);
  let line;
  if (best < 6.5) line = Math.floor(best + 0.5) % 2 === 0;
  else line = ((Math.floor(oz) % 2) + 2) % 2 === 0;
  return jit(line ? 0xD2CCBF : 0xEFEBE2, 0.02);
}
function rockColor(x, y, z) {
  const n = vnoise3(x * 0.3, y * 0.3, z * 0.3);
  return jit(mixc(0x77736C, 0xA8A398, n), 0.07);
}
const SOIL = [0x6E4A2F, 0x7A5536, 0x634229, 0x845D3B];
const STRATA = [0x9A8670, 0xB08C68, 0x8A7C6C, 0xC49A6C, 0x7C7068, 0xA8927A, 0x94806A, 0xB5825A, 0xA49A88];
function strata(x, y, z) {
  const n = fbm3(x * 0.06, y * 0.1, z * 0.06, 2);
  const band = Math.floor(y / 3.4 + n * 3.2);
  let c = STRATA[((band % STRATA.length) + STRATA.length) % STRATA.length];
  if (hash3(x, y, z) > 0.985) c = 0x5E5A55;
  return jit(c, 0.06);
}
function surfaceColor(type, x, z, top) {
  switch (type) {
    case T_GRASS: return grassColor(x, z);
    case T_PATH: return pathColor(x, z);
    case T_GRAVEL: return gravelColor(x, z);
    case T_POND: return jit(pick([0x7D7356, 0x6B6450, 0x8A8064, 0x5E6B4A, 0x6F7552]), 0.06);
    case T_STREAM: return jit(pick([0x8E8A80, 0x7C786F, 0xA39E92, 0x6F7A5A]), 0.06);
    case T_SHORE: return jit(pick([0xA8A090, 0x9A9384, 0xBDB5A3, 0x8D8676, 0x7E8C5A, 0xB3AB97]), 0.05);
    case T_ROCK: case T_CASCADE: return rand() < 0.35 ? jit(0x6E9440, 0.1) : rockColor(x, top, z);
    case T_LITTER: return jit(pick([0x7A6A3A, 0x8B7A44, 0x6B7A35, 0x9A8550, 0x5F7030, 0x8F8A3E]), 0.07);
    case T_FINE: return jit(pick([0xC9C2B2, 0xBDB6A6, 0xD3CDBF, 0xB8B09F]), 0.03);
  }
  return 0xff00ff;
}

// =============================================================================
//  Terrain
// =============================================================================
function islandDepth(x, z, s) {
  const t = Math.min(1, s);
  let d = 4 + 37 * Math.pow(1 - Math.pow(t, 1.7), 0.85);
  d += (fbm2(x * 0.08 + 11, z * 0.08 + 5, 3) - 0.5) * 12;
  const sp = vnoise2(x * 0.2 + 3.3, z * 0.2 + 7.7);
  if (sp > 0.68) d += (sp - 0.68) * 52 * (1 - t * 0.5);
  return Math.max(3, Math.round(d));
}

function genTerrain(W) {
  const { g, H, T, S } = W;
  // pass 1: heights + surface types
  for (let z = 0; z < SZ; z++) for (let x = 0; x < SX; x++) {
    const k = z * SX + x;
    const s = islandS(x, z); S[k] = s;
    if (s >= 1) continue;
    const ox = x - CX, oz = z - CZ;
    let top = G, type = T_GRASS;
    const hd = Math.hypot(ox - 42, oz + 20) / 18;
    if (hd < 1) {
      const h = 14 * Math.pow(1 - hd * hd, 1.3) + (fbm2(x * 0.17, z * 0.17, 2) - 0.5) * 5 * (1 - hd);
      top = G + Math.max(0, Math.round(h));
    }
    for (const m of MOUNDS) {
      const d = Math.hypot(ox - m.x, oz - m.z) / m.r;
      if (d < 1) top = Math.max(top, G + Math.round(m.h * (1 - d * d) + 0.2));
    }
    if (Math.hypot(ox + 48, oz + 40) < 18) type = T_LITTER;
    if (ox >= -6 && ox <= -2 && oz >= 2) { type = T_PATH; top = isPathGap(ox, oz) ? G - 1 : G; }
    if (inShrinePath(ox, oz)) { type = T_FINE; top = G; }
    if (ox >= -67 && ox <= -57 && oz >= -18 && oz <= 2) { type = T_FINE; top = G; }
    if (rockGardenF(ox, oz) > 0) { type = T_GRAVEL; top = G; }
    const pf = pondF(ox, oz);
    if (pf > 0) { type = T_POND; top = G - 3 - Math.min(2, Math.floor(pf * 5)); }
    else if (pf > -0.16 && (type === T_GRASS || type === T_LITTER)) { type = T_SHORE; top = G; }
    if (oz >= 26) {
      const dc = Math.abs(ox + 0.5 - streamCx(oz));
      if (dc <= 2.2) { type = T_STREAM; top = G - 2 - (dc < 1.2 ? 1 : 0); }
      else if (dc <= 3.9 && type === T_GRASS) { type = T_SHORE; top = G; }
    }
    H[k] = top; T[k] = type;
  }
  // hill: steep cells become rock
  for (let z = 1; z < SZ - 1; z++) for (let x = 1; x < SX - 1; x++) {
    const k = z * SX + x;
    if (T[k] !== T_GRASS || H[k] <= G + 1) continue;
    const h = H[k];
    const sl = Math.max(Math.abs(h - H[k - 1]), Math.abs(h - H[k + 1]), Math.abs(h - H[k - SX]), Math.abs(h - H[k + SX]));
    if (sl >= 2 || (h > G + 3 && vnoise2(x * 0.3, z * 0.3) > 0.62)) T[k] = T_ROCK;
  }
  // pass 2: fill columns
  for (let z = 0; z < SZ; z++) for (let x = 0; x < SX; x++) {
    const k = z * SX + x;
    const s = S[k]; if (s >= 1) continue;
    const top = H[k], type = T[k];
    const bottom = Math.max(1, G - islandDepth(x, z, s));
    const edge = S[k - 1] >= 1 || S[k + 1] >= 1 || S[k - SX] >= 1 || S[k + SX] >= 1;
    const rocky = type === T_ROCK || top > G + 2;
    for (let y = bottom; y <= top; y++) {
      const dt = top - y;
      let c;
      if (dt === 0) c = surfaceColor(type, x, z, top);
      else if (edge && dt <= 1 && type !== T_POND && type !== T_STREAM) c = jit(dt === 1 ? 0x4E8C32 : 0x5A9A38, 0.08);
      else if (rocky && y > G - 3) c = rockColor(x, y, z);
      else if (y > G - 3 - (hash2(x, z) * 3 | 0)) c = jit(pick(SOIL), 0.06);
      else if (y > G - 6) c = jit(mixc(pick(SOIL), 0x7A6E62, 0.55), 0.06);
      else c = strata(x, y, z);
      if (y <= bottom + 1) c = mulc(c, 0.9);
      g.set(x, y, z, c);
    }
  }
}

function genWater(W) {
  const { g, H, T, S } = W;
  for (let z = 0; z < SZ; z++) for (let x = 0; x < SX; x++) {
    const k = z * SX + x;
    const t = T[k];
    if (t !== T_POND && t !== T_STREAM) continue;
    const ox = x - CX, oz = z - CZ;
    const foam = t === T_POND ? clamp(1 - Math.hypot(ox - 36.5, oz + 1) / 6, 0, 1) : 0.06;
    const depth = (G - 1 - H[k]) / 4;
    for (let y = H[k] + 1; y <= G - 1; y++) g.set(x, y, z, waterCol(foam, depth), WATER);
  }
  // waterfall off the island's front edge
  let fx0 = 1e9, fx1 = -1e9, fz = 0;
  for (let x = CX + 12; x <= CX + 32; x++) {
    let zl = -1;
    for (let z = CZ + 26; z < SZ; z++) if (T[z * SX + x] === T_STREAM) zl = z;
    if (zl < 0 || zl + 1 >= SZ || S[(zl + 1) * SX + x] < 1) continue;
    for (let y = G - 1; y >= 3; y--) g.set(x, y, zl + 1, waterCol(y > G - 4 ? 0.85 : 0.45, 0.2), WATER);
    fx0 = Math.min(fx0, x); fx1 = Math.max(fx1, x); fz = Math.max(fz, zl + 1);
  }
  if (fx1 >= fx0) {
    W.fall = { x: (fx0 + fx1 + 1) / 2, z: fz + 0.5, w: fx1 - fx0 + 1 };
    for (let i = 0; i < 26; i++) W.mist.push([RR(fx0 - 2, fx1 + 3), RR(4, 20), fz + RR(-2, 4), RR(0, 1), 1]);
  }
}

function raiseCol(W, x, z, top) {
  const k = z * SX + x;
  if (W.S[k] >= 1) return;
  if (W.H[k] < top) {
    for (let y = W.H[k] + 1; y <= top; y++) W.g.set(x, y, z, y === top && rand() < 0.4 ? jit(0x6E9440, 0.1) : rockColor(x, y, z));
    W.H[k] = top; W.T[k] = T_ROCK;
  }
}

function genCascade(W) {
  const { g, H, T } = W;
  const x0 = CX + 35, x1 = CX + 38;
  const steps = [
    { z0: -23, z1: -18, lvl: G + 9 }, { z0: -17, z1: -13, lvl: G + 6 },
    { z0: -12, z1: -7, lvl: G + 3 }, { z0: -6, z1: -1, lvl: G - 1 },
  ];
  for (let oz = -27; oz <= -24; oz++) for (let x = x0 - 3; x <= x1 + 3; x++) raiseCol(W, x, CZ + oz, steps[0].lvl + 2 + (oz < -25 ? 1 : 0));
  for (let si = 0; si < steps.length; si++) {
    const s = steps[si], prev = steps[si - 1];
    for (let oz = s.z0; oz <= s.z1; oz++) {
      const z = CZ + oz;
      const near = prev && oz - s.z0 < 2;
      const wallTop = Math.max(s.lvl, near ? prev.lvl : -1) + 1;
      for (const x of [x0 - 3, x0 - 2, x0 - 1, x1 + 1, x1 + 2, x1 + 3]) {
        const outer = x === x0 - 3 || x === x1 + 3;
        raiseCol(W, x, z, wallTop - (outer ? 1 : 0) + (rand() < 0.3 ? 1 : 0));
      }
      for (let x = x0; x <= x1; x++) {
        const k = z * SX + x;
        const bed = s.lvl - 2;
        for (let y = H[k] + 1; y <= bed; y++) g.set(x, y, z, rockColor(x, y, z));
        for (let y = bed + 1; y < SY; y++) g.del(x, y, z);
        g.set(x, bed, z, jit(pick([0x6F6A62, 0x7E796F, 0x5F6A4A]), 0.06));
        H[k] = bed; T[k] = T_CASCADE;
        const foam = prev ? clamp(1 - (oz - s.z0) / 3, 0, 1) : 0.15;
        for (let y = bed + 1; y <= s.lvl; y++) g.set(x, y, z, waterCol(foam, 0.35), WATER);
        if (prev && oz === s.z0) for (let y = s.lvl + 1; y <= prev.lvl; y++) g.set(x, y, z, waterCol(0.7, 0.2), WATER);
      }
      if (prev && oz === s.z0) for (let i = 0; i < 4; i++) W.mist.push([RR(x0, x1 + 1), s.lvl + RR(0.5, 2), z + RR(0.5, 2), RR(0, 1), 0]);
    }
  }
}

function genVines(W) {
  const { g, H, S } = W;
  const flowers = [0xF8A5C2, 0xFFFFFF, 0xC5A3FF, 0xFFD166];
  for (let z = 1; z < SZ - 1; z++) for (let x = 1; x < SX - 1; x++) {
    const k = z * SX + x;
    if (S[k] >= 1) continue;
    const outs = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([dx, dz]) => S[k + dx + dz * SX] >= 1);
    if (!outs.length) continue;
    if (rand() < 0.16) {
      const [dx, dz] = pick(outs);
      const vx = x + dx, vz = z + dz;
      const len = RI(3, 15);
      const top = Math.min(H[k], G) - (rand() < 0.5 ? 0 : 1);
      for (let i = 0; i < len; i++) {
        const y = top - i;
        const c = rand() < 0.14 ? pick(flowers) : (i % 3 === 0 ? 0x4F8A35 : 0x5FA040);
        g.put(vx, y, vz, jit(c, 0.08));
      }
    }
    if (rand() < 0.06) { // boulder on rim
      const [dx, dz] = pick(outs);
      g.put(x - dx, H[k] + 1, z - dz, rockColor(x, H[k], z));
    }
  }
  // hanging roots / rock drips under the island
  for (let z = 0; z < SZ; z++) for (let x = 0; x < SX; x++) {
    const k = z * SX + x;
    if (S[k] >= 0.95 || rand() > 0.012) continue;
    let by = -1;
    for (let y = 0; y < G; y++) if (g.get(x, y, z)) { by = y; break; }
    if (by < 2) continue;
    const len = RI(2, 6), root = rand() < 0.5;
    for (let i = 1; i <= len; i++) g.put(x, by - i, z, jit(root ? 0x5C4033 : 0x6F675F, 0.08));
  }
}

// =============================================================================
//  Plants
// =============================================================================
function blossomCluster(ctx, cx, cy, cz, r, pal) {
  const g = ctx.g;
  ctx.blossoms.push([cx, cy, cz, r]);
  const ry = r * 0.72;
  for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry + 1); y++)
    for (let z = Math.floor(cz - r - 1); z <= Math.ceil(cz + r + 1); z++)
      for (let x = Math.floor(cx - r - 1); x <= Math.ceil(cx + r + 1); x++) {
        const dx = (x + 0.5 - cx) / r, dy = (y + 0.5 - cy) / ry, dz = (z + 0.5 - cz) / r;
        const d = dx * dx + dy * dy + dz * dz;
        if (d > 1.3) continue;
        const n = vnoise3(x * 0.38 + 5, y * 0.38, z * 0.38);
        if (d > 0.5 + n * 0.75) continue;
        if (rand() < 0.07) continue;
        const t = clamp(dy * 0.5 + 0.5, 0, 1);
        let c = mixc(pal.lo, pal.hi, t * t * 0.7 + t * 0.3);
        const q = rand();
        if (q < 0.06) c = pal.acc; else if (q < 0.1) c = mulc(pal.lo, 0.88);
        g.put(x, y, z, jit(c, 0.04));
      }
}

function leafPad(ctx, cx, cy, cz, rx, ry, rz, pal, fluff = 0.7, holes = 0.06, onlyEmpty = true) {
  const g = ctx.g;
  for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry + 1); y++)
    for (let z = Math.floor(cz - rz - 1); z <= Math.ceil(cz + rz + 1); z++)
      for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx + 1); x++) {
        const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry, dz = (z + 0.5 - cz) / rz;
        const d = dx * dx + dy * dy + dz * dz;
        if (d > 1.35) continue;
        const n = vnoise3(x * 0.42 + 9, y * 0.42, z * 0.42 + 2);
        if (d > 0.55 + n * fluff) continue;
        if (rand() < holes) continue;
        let c = pick(pal);
        if (dy > 0.35) c = mixc(c, 0xFFFFFF, 0.1);
        else if (dy < -0.3) c = mulc(c, 0.82);
        if (onlyEmpty) g.put(x, y, z, jit(c, 0.05)); else g.set(x, y, z, jit(c, 0.05));
      }
}

function cherryTree(ctx, x, z, o = {}) {
  const g = ctx.g;
  const y = o.y ?? ctx.ground(x, z) + 1;
  const s = o.scale ?? 1, pal = o.pal ?? SAKURA[0], bark = o.bark ?? PAL.bark;
  const tips = [];
  const barkFn = () => jit(rand() < 0.15 ? PAL.barkDark : bark, 0.1);
  const grow = (p, d, len, rad, depth) => {
    const mid = vadd(p, vmul(d, len * 0.5));
    const bend = vnorm(vadd(d, [RR(-0.3, 0.3), RR(-0.12, 0.1), RR(-0.3, 0.3)]));
    const end = vadd(mid, vmul(bend, len * 0.5));
    g.line(p[0], p[1], p[2], mid[0], mid[1], mid[2], rad, rad * 0.86, barkFn);
    g.line(mid[0], mid[1], mid[2], end[0], end[1], end[2], rad * 0.86, rad * 0.72, barkFn);
    if (depth === 0) { tips.push(end); return; }
    const n = depth === (o.depth ?? 3) ? RI(3, 4) : RI(2, 3);
    const [u, v] = vbasis(bend);
    const az0 = rand() * Math.PI * 2;
    for (let i = 0; i < n; i++) {
      const az = az0 + (i / n) * Math.PI * 2 + RR(-0.4, 0.4);
      const tilt = depth === (o.depth ?? 3) ? RR(0.75, 1.05) : RR(0.45, 0.85);
      let nd = vadd(vmul(bend, Math.cos(tilt)), vmul(vadd(vmul(u, Math.cos(az)), vmul(v, Math.sin(az))), Math.sin(tilt)));
      nd[1] += 0.12; nd = vnorm(nd);
      grow(end, nd, len * RR(0.58, 0.76), Math.max(0.5, rad * 0.6), depth - 1);
    }
    if (depth <= 1) tips.push(end);
  };
  const d0 = vnorm([RR(-0.25, 0.25), 1, RR(-0.25, 0.25)]);
  grow([x + 0.5, y, z + 0.5], d0, (o.trunk ?? 8) * s, 1.75 * s, o.depth ?? 3);
  for (const t of tips) blossomCluster(ctx, t[0], t[1] + 0.6, t[2], RR(3.3, 4.6) * s, pal);
  ctx.cherries.push({ x, z, r: 13 * s });
}

function weepingCherry(ctx, x, z) {
  const g = ctx.g;
  const y = ctx.ground(x, z) + 1;
  const pal = { lo: 0xEB78A3, hi: 0xFFC9DC, acc: 0xFFF4F8 };
  const barkFn = () => jit(rand() < 0.2 ? PAL.barkDark : 0x4D3833, 0.1);
  const top = [x + 0.5 + 1, y + 11, z + 0.5];
  g.line(x + 0.5, y, z + 0.5, x + 0.5 + 0.6, y + 6, z + 0.5, 2.1, 1.7, barkFn);
  g.line(x + 1.1, y + 6, z + 0.5, top[0], top[1], top[2], 1.7, 1.3, barkFn);
  const N = 11;
  for (let i = 0; i < N; i++) {
    const az = (i / N) * Math.PI * 2 + RR(-0.2, 0.2);
    const reach = RR(10, 14), lift = RR(4, 6.5);
    const ca = Math.cos(az), sa = Math.sin(az);
    let prev = top;
    const pts = [];
    for (let k = 1; k <= 14; k++) {
      const t = k / 14;
      const p = [top[0] + ca * reach * t, top[1] + lift * Math.sin(Math.PI * t * 0.85) - t * t * 2.5, top[2] + sa * reach * t];
      g.line(prev[0], prev[1], prev[2], p[0], p[1], p[2], 0.95 - t * 0.4, 0.9 - t * 0.4, barkFn);
      pts.push(p); prev = p;
    }
    for (let k = 2; k < pts.length; k++) {
      const p = pts[k];
      if (k % 2 === 0 || k < 6) blossomCluster(ctx, p[0] + RR(-1, 1), p[1] + 0.8, p[2] + RR(-1, 1), RR(1.6, 2.3), pal);
      // weeping strands
      const strands = RI(2, 4);
      for (let sI = 0; sI < strands; sI++) {
        const sx0 = Math.floor(p[0] + RR(-1.6, 1.6)), sz0 = Math.floor(p[2] + RR(-1.6, 1.6));
        const len = Math.floor(RR(5, 10) + (k / pts.length) * 7);
        const gy = Math.max(ctx.ground(sx0, sz0), G);
        for (let j = 0; j < len; j++) {
          const yy = Math.floor(p[1]) - j;
          if (yy <= gy + 2) break;
          const t = j / len;
          let c = mixc(pal.hi, pal.lo, t * 0.9);
          if (rand() < 0.08) c = pal.acc;
          if (rand() < 0.12) continue;
          g.put(sx0, yy, sz0, jit(c, 0.05));
          if (rand() < 0.22) g.put(sx0 + pick([-1, 1]), yy, sz0, jit(c, 0.05));
          if (rand() < 0.22) g.put(sx0, yy, sz0 + pick([-1, 1]), jit(c, 0.05));
        }
      }
    }
  }
  blossomCluster(ctx, top[0], top[1] + 3, top[2], 5.2, pal);
  ctx.cherries.push({ x, z, r: 15 });
}

function mapleTree(ctx, x, z, pal, o = {}) {
  const g = ctx.g;
  const y = ctx.ground(x, z) + 1;
  const s = o.scale ?? 1;
  const barkFn = () => jit(rand() < 0.2 ? 0x3B2B26 : 0x54403A, 0.1);
  const th = 5 * s;
  const tt = [x + 0.5 + RR(-1, 1), y + th, z + 0.5 + RR(-1, 1)];
  g.line(x + 0.5, y, z + 0.5, tt[0], tt[1], tt[2], 1.5 * s, 1.1 * s, barkFn);
  const n = RI(4, 5), az0 = rand() * 6.28;
  for (let i = 0; i < n; i++) {
    const az = az0 + (i / n) * 6.28 + RR(-0.3, 0.3);
    const len = RR(6, 8) * s, rise = RR(2.5, 4.5) * s;
    const e = [tt[0] + Math.cos(az) * len, tt[1] + rise, tt[2] + Math.sin(az) * len];
    g.line(tt[0], tt[1], tt[2], e[0], e[1], e[2], 0.95 * s, 0.6, barkFn);
    leafPad(ctx, e[0], e[1] + 1.2, e[2], RR(4.5, 5.8) * s, RR(2.2, 2.8) * s, RR(4.5, 5.8) * s, pal);
    for (let j = 0; j < 2; j++) {
      const a2 = az + RR(-0.9, 0.9);
      const e2 = [e[0] + Math.cos(a2) * RR(2, 4) * s, e[1] + RR(1.5, 3.5) * s, e[2] + Math.sin(a2) * RR(2, 4) * s];
      g.line(e[0], e[1], e[2], e2[0], e2[1], e2[2], 0.6, 0.5, barkFn);
      leafPad(ctx, e2[0], e2[1] + 1, e2[2], RR(3.2, 4.2) * s, RR(1.8, 2.4) * s, RR(3.2, 4.2) * s, pal);
    }
  }
  leafPad(ctx, tt[0], tt[1] + 6 * s, tt[2], 5 * s, 2.8 * s, 5 * s, pal);
  ctx.leafCarpets.push({ x, z, r: 9 * s, pal, p: 0.18 });
}

function pineTree(ctx, x, z, o = {}) {
  const g = ctx.g;
  const y = o.y ?? ctx.ground(x, z) + 1;
  const s = o.scale ?? 1;
  const needles = [0x2F5D3A, 0x386B42, 0x2A5233, 0x3F7548, 0x325F3B];
  const barkFn = () => jit(pick([0x6B4F3A, 0x5A4232, 0x7A5A40]), 0.08);
  const h = Math.round((o.h ?? 13) * s);
  const az = rand() * 6.28, ca = Math.cos(az), sa = Math.sin(az);
  const pts = [];
  for (let i = 0; i <= h; i++) {
    const t = i / h;
    const off = Math.sin(t * Math.PI * 1.3) * 2.6 * s;
    pts.push([x + 0.5 + ca * off, y + i, z + 0.5 + sa * off]);
  }
  for (let i = 1; i < pts.length; i++) {
    const t = i / pts.length;
    g.line(pts[i - 1][0], pts[i - 1][1], pts[i - 1][2], pts[i][0], pts[i][1], pts[i][2], (1.5 - t * 0.8) * s, (1.5 - t * 0.8) * s, barkFn);
  }
  const levels = o.levels ?? [0.38, 0.58, 0.78];
  levels.forEach((lv, i) => {
    const p = pts[Math.floor(lv * h)];
    const a = az + Math.PI * (i % 2) + RR(-0.7, 0.7);
    const len = RR(4, 6.5) * s * (1 - lv * 0.3);
    const e = [p[0] + Math.cos(a) * len, p[1] + RR(0.5, 1.5), p[2] + Math.sin(a) * len];
    g.line(p[0], p[1], p[2], e[0], e[1], e[2], 0.75 * s, 0.55, barkFn);
    const pr = (RR(3.6, 4.6) - lv * 1.2) * s;
    leafPad(ctx, e[0], e[1] + 0.6, e[2], pr, 1.5 * s, pr * 0.85, needles, 0.45, 0.03);
  });
  const tp = pts[pts.length - 1];
  leafPad(ctx, tp[0], tp[1] + 1, tp[2], 3.8 * s, 1.9 * s, 3.8 * s, needles, 0.45, 0.03);
}

function ginkgoTree(ctx, x, z) {
  const g = ctx.g;
  const y = ctx.ground(x, z) + 1;
  const barkFn = () => jit(pick([0x6A5546, 0x5B483C]), 0.08);
  g.line(x + 0.5, y, z + 0.5, x + 0.5, y + 19, z + 0.5, 1.5, 0.7, barkFn);
  for (let i = 0; i < 7; i++) {
    const yy = y + 6 + i * 2, a = rand() * 6.28, l = RR(3, 6) * (1 - i / 9);
    g.line(x + 0.5, yy, z + 0.5, x + 0.5 + Math.cos(a) * l, yy + 3, z + 0.5 + Math.sin(a) * l, 0.6, 0.5, barkFn);
  }
  for (let i = 0; i < 6; i++) {
    const t = i / 5;
    const r = 7.2 * (1 - t * 0.62) + RR(-0.5, 0.5);
    leafPad(ctx, x + 0.5 + RR(-1, 1), y + 7 + t * 14, z + 0.5 + RR(-1, 1), r, 2.8, r, GINKGO, 0.75, 0.08);
  }
  ctx.leafCarpets.push({ x, z, r: 10, pal: GINKGO, p: 0.42 });
}

function bambooGrove(ctx, W, cx, cz, R) {
  const g = ctx.g;
  const stalks = [];
  const greens = [0x7DB343, 0x8BC34A, 0x6A9B3A, 0x9CCC65, 0x5E9136];
  const leaves = [0x8BC34A, 0x9CCC65, 0x7CB342, 0xAED581, 0x689F38];
  for (let tries = 0; tries < 2000 && stalks.length < 95; tries++) {
    const ox = cx + RR(-R, R), oz = cz + RR(-R, R);
    if (Math.hypot(ox - cx, oz - cz) > R) continue;
    const x = CX + Math.floor(ox), z = CZ + Math.floor(oz);
    const k = z * SX + x;
    if (W.S[k] > 0.93 || W.T[k] !== T_LITTER) continue;
    if (Math.abs(ox + 40) < 5.5 && oz > -54 && oz < -10) continue;   // torii path
    if (ox > -47 && ox < -33 && oz > -56 && oz < -42) continue;       // shrine
    if (stalks.some((s) => Math.abs(s[0] - x) + Math.abs(s[1] - z) < 3)) continue;
    stalks.push([x, z]);
  }
  for (const [x, z] of stalks) {
    const y0 = W.H[z * SX + x] + 1;
    const h = RI(24, 38);
    const base = pick(greens);
    const lean = [RR(-2.5, 2.5), RR(-2.5, 2.5)];
    let px = x + 0.5, pz = z + 0.5;
    for (let i = 0; i < h; i++) {
      const t = i / h;
      const xx = x + 0.5 + lean[0] * t * t, zz = z + 0.5 + lean[1] * t * t;
      const node = i % 5 === 4;
      g.set(xx, y0 + i, zz, jit(node ? mixc(base, 0xE6EE9C, 0.45) : base, 0.04));
      if (Math.floor(xx) !== Math.floor(px) || Math.floor(zz) !== Math.floor(pz)) g.set(xx, y0 + i - 1, zz, jit(base, 0.04));
      px = xx; pz = zz;
      if (t > 0.45 && node) {
        const n = RI(1, 3);
        for (let j = 0; j < n; j++) {
          const a = rand() * 6.28, L = RR(2, 5);
          for (let s = 1; s <= L; s++) {
            const lx = xx + Math.cos(a) * s, lz = zz + Math.sin(a) * s, ly = y0 + i - s * 0.35;
            g.put(lx, ly, lz, jit(pick(leaves), 0.06));
            if (rand() < 0.5) g.put(lx + RR(-1, 1), ly - 1, lz + RR(-1, 1), jit(pick(leaves), 0.06));
          }
        }
      }
    }
    leafPad(ctx, x + 0.5 + lean[0], y0 + h, z + 0.5 + lean[1], 2.2, 1.6, 2.2, leaves, 0.6, 0.25);
    if (rand() < 0.12) { // bamboo shoot
      const sx = x + RI(-2, 2), sz = z + RI(-2, 2), sy = W.H[sz * SX + sx] + 1;
      if (g.empty(sx, sy, sz)) { g.set(sx, sy, sz, 0x9A7B4F); g.set(sx, sy + 1, sz, 0xB59563); g.set(sx, sy + 2, sz, 0xC9B07A); }
    }
  }
}

const FLOWER_SETS = {
  azalea: { leaf: [0x3E7D32, 0x4C8C3A, 0x2E6B2A], flower: [0xE91E63, 0xF06292, 0xFF5C8A, 0xC2185B, 0xFF80AB], p: 0.72 },
  azaleaWhite: { leaf: [0x3E7D32, 0x4C8C3A], flower: [0xFFFFFF, 0xFDEFF4, 0xFFE4EC], p: 0.68 },
  azaleaCoral: { leaf: [0x3E7D32, 0x4C8C3A], flower: [0xFF7043, 0xFF8A65, 0xF4511E, 0xFF6E6E], p: 0.7 },
  kerria: { leaf: [0x558B2F, 0x689F38], flower: [0xFFC107, 0xFFD54F, 0xFFB300, 0xFFE082], p: 0.55 },
  box: { leaf: [0x4F7F2A, 0x5E8E33, 0x46752A, 0x6A9A3A], flower: [], p: 0 },
};
function bush(ctx, x, z, r, kind, o = {}) {
  const g = ctx.g;
  const set = FLOWER_SETS[kind];
  const y = (o.y ?? ctx.ground(x, z) + 1);
  const cx = x + 0.5, cz = z + 0.5, cy = y + r * 0.35;
  const ry = r * (o.flat ?? 0.75);
  for (let yy = y; yy <= Math.ceil(cy + ry + 1); yy++)
    for (let zz = Math.floor(cz - r - 1); zz <= Math.ceil(cz + r + 1); zz++)
      for (let xx = Math.floor(cx - r - 1); xx <= Math.ceil(cx + r + 1); xx++) {
        const dx = (xx + 0.5 - cx) / r, dy = (yy + 0.5 - cy) / ry, dz = (zz + 0.5 - cz) / r;
        const d = dx * dx + dy * dy + dz * dz;
        const n = vnoise3(xx * 0.5, yy * 0.5, zz * 0.5);
        if (d > 0.6 + n * 0.5) continue;
        const outer = d > 0.35;
        const c = outer && set.flower.length && rand() < set.p ? pick(set.flower) : pick(set.leaf);
        g.put(xx, yy, zz, jit(c, 0.05));
      }
  ctx.fireflies.push([cx, cy + 2, cz]);
}
function hydrangea(ctx, x, z, r) {
  const g = ctx.g;
  bush(ctx, x, z, r, 'box');
  const y = ctx.ground(x, z) + 1;
  const cols = [0x5C6BC0, 0x7986CB, 0x9575CD, 0x64B5F6, 0xBA68C8, 0x4FC3F7, 0xF48FB1];
  const n = RI(6, 10);
  for (let i = 0; i < n; i++) {
    const a = rand() * 6.28, el = RR(0.1, 1.2);
    const bx = x + 0.5 + Math.cos(a) * Math.cos(el) * r * 0.85, bz = z + 0.5 + Math.sin(a) * Math.cos(el) * r * 0.85;
    const by = y + r * 0.35 + Math.sin(el) * r * 0.75;
    const c = pick(cols);
    g.ball(bx, by, bz, RR(1.3, 1.8), () => jit(rand() < 0.2 ? mixc(c, 0xFFFFFF, 0.35) : c, 0.06));
  }
}
function irisClump(ctx, x, z) {
  const g = ctx.g;
  const y = ctx.ground(x, z) + 1;
  const fc = pick([[0x6A4BC4, 0x8E6CF0], [0x5B3FB5, 0x7E57C2], [0x3949AB, 0x5C6BC0], [0xF5F5F5, 0xE8E0FF]]);
  for (let i = 0; i < RI(3, 6); i++) {
    const lx = x + RI(-1, 1), lz = z + RI(-1, 1), h = RI(2, 4);
    if (!g.empty(lx, y, lz)) continue;
    for (let j = 0; j < h; j++) g.put(lx, y + j, lz, jit(pick([0x4C8C3A, 0x5A9E45, 0x3F7A30]), 0.06));
    if (rand() < 0.6) { g.put(lx, y + h, lz, jit(fc[0], 0.05)); if (rand() < 0.5) g.put(lx, y + h + 1, lz, jit(fc[1], 0.05)); }
  }
}
function rock(ctx, cx, cy, cz, rx, ry, rz, moss = 0.5, cols) {
  const g = ctx.g;
  const inside = (x, y, z) => {
    const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry, dz = (z + 0.5 - cz) / rz;
    return dx * dx + dy * dy + dz * dz + (vnoise3(x * 0.45, y * 0.45, z * 0.45) - 0.5) * 0.7 < 1;
  };
  for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry + 1); y++)
    for (let z = Math.floor(cz - rz - 1); z <= Math.ceil(cz + rz + 1); z++)
      for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx + 1); x++) {
        if (!inside(x, y, z)) continue;
        const topv = !inside(x, y + 1, z);
        let c = cols ? pick(cols) : mixc(0x76726B, 0xA9A499, vnoise3(x * 0.25 + 4, y * 0.4, z * 0.25));
        if (topv && rand() < moss) c = pick([0x6E9A3B, 0x5F8A32, 0x7FAA45]);
        g.set(x, y, z, jit(c, 0.06));
      }
}

function stoneLantern(ctx, x, z, o = {}) {
  const g = ctx.g;
  const y = o.y ?? ctx.ground(x, z) + 1;
  const st = () => jit(rand() < 0.12 ? 0x7FA048 : mixc(PAL.stone, PAL.stoneLight, rand() * 0.5), 0.04);
  const sq = (r, yy, cut = true) => { for (let dz = -r; dz <= r; dz++) for (let dx = -r; dx <= r; dx++) { if (cut && Math.abs(dx) === r && Math.abs(dz) === r) continue; g.set(x + dx, yy, z + dz, st()); } };
  sq(2, y); sq(1, y + 1, false);
  g.set(x, y + 2, z, st()); g.set(x, y + 3, z, st());
  sq(2, y + 4);
  for (let yy = y + 5; yy <= y + 6; yy++) for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
    const corner = Math.abs(dx) === 1 && Math.abs(dz) === 1;
    if (corner) g.set(x + dx, yy, z + dz, st()); else g.set(x + dx, yy, z + dz, jit(PAL.paper, 0.03), GLOW);
  }
  sq(3, y + 7); sq(2, y + 8, false); sq(1, y + 9, false);
  for (const [dx, dz] of [[3, 3], [-3, 3], [3, -3], [-3, -3]]) g.set(x + dx, y + 8, z + dz, st());
  g.set(x, y + 10, z, st());
  g.lamps.push({ x: x + 0.5, y: y + 6, z: z + 0.5, r: 12, c: [1.0, 0.62, 0.28] });
}

function yukimiLantern(ctx, x, z) {
  const g = ctx.g;
  const y = ctx.ground(x, z) + 1;
  const st = () => jit(mixc(PAL.stone, PAL.stoneLight, rand() * 0.6), 0.04);
  for (const [dx, dz] of [[-2, -2], [2, -2], [-2, 2], [2, 2]]) { g.set(x + dx, y, z + dz, st()); g.set(x + dx * 0.5, y + 1, z + dz * 0.5, st()); }
  for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) g.set(x + dx, y + 2, z + dz, st());
  for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
    const corner = Math.abs(dx) === 1 && Math.abs(dz) === 1;
    g.set(x + dx, y + 3, z + dz, corner ? st() : jit(PAL.paper, 0.03), corner ? SOLID : GLOW);
  }
  for (let r = 4; r >= 1; r--) {
    const yy = y + 4 + (4 - r);
    for (let dz = -r; dz <= r; dz++) for (let dx = -r; dx <= r; dx++) {
      if (r > 1 && Math.abs(dx) === r && Math.abs(dz) === r) continue;
      g.set(x + dx, yy, z + dz, st());
    }
  }
  g.set(x, y + 8, z, st());
  g.lamps.push({ x: x + 0.5, y: y + 3.5, z: z + 0.5, r: 11, c: [1.0, 0.62, 0.28] });
}

function chochin(ctx, x, y, z, col = PAL.lanternRed) {
  // hanging paper lantern, top at y
  const g = ctx.g;
  g.set(x, y, z, PAL.black);
  for (let yy = y - 1; yy >= y - 4; yy--) {
    const band = yy === y - 2;
    for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
      if (Math.abs(dx) === 1 && Math.abs(dz) === 1 && (yy === y - 1 || yy === y - 4)) continue;
      g.set(x + dx, yy, z + dz, jit(band ? 0xF6C76A : col, 0.03), GLOW_SOFT);
    }
  }
  g.set(x, y - 5, z, PAL.black);
  g.lamps.push({ x: x + 0.5, y: y - 2, z: z + 0.5, r: 11, c: [1.0, 0.45, 0.25] });
}

function lanternString(ctx, x0, x1, z, y) {
  const g = ctx.g;
  const cols = [0xE8432F, 0xFFF1E0, 0xF48FB1, 0xE8432F, 0xFFD166];
  let k = 0;
  for (let x = x0 + 1; x < x1; x++) {
    const t = (x - x0) / (x1 - x0);
    const yy = Math.round(y - Math.sin(Math.PI * t) * 2.2);
    g.set(x, yy, z, 0x3A2A22);
    if ((x - x0) % 3 === 0) {
      const c = cols[k++ % cols.length];
      g.set(x, yy - 1, z, jit(c, 0.03), GLOW_SOFT); g.set(x, yy - 2, z, jit(c, 0.03), GLOW_SOFT);
    }
  }
  g.lamps.push({ x: (x0 + x1) / 2 + 0.5, y: y - 3, z: z + 0.5, r: 10, c: [1.0, 0.55, 0.32] });
}

function lanternPost(ctx, x, z, side) {
  const g = ctx.g;
  const y = ctx.ground(x, z) + 1;
  for (let i = 0; i < 12; i++) g.set(x, y + i, z, jit(PAL.woodDark, 0.06));
  g.set(x, y + 12, z, PAL.black);
  for (let i = 1; i <= 2; i++) g.set(x + side * i, y + 11, z, jit(PAL.woodDark, 0.06));
  chochin(ctx, x + side * 3, y + 11, z, pick([PAL.lanternRed, 0xF0603A, 0xE8432F]));
}

function torii(ctx, cx, z, half, h, o = {}) {
  // gate across x, at depth z. pillars at cx +- half
  const g = ctx.g;
  const y = o.y ?? G + 1;
  const thick = o.thick ?? 2;
  const verm = o.verm ?? 0xE0452B;
  const vc = () => jit(verm, 0.03);
  const pillarX = [cx - half, cx + half];
  for (const px of pillarX) {
    for (let yy = y; yy < y + h - 2; yy++) for (let a = 0; a < thick; a++) for (let b = 0; b < thick; b++) {
      g.set(px + a - (thick > 1 ? (px < cx ? 1 : 0) : 0), yy, z + b - (thick > 1 ? 1 : 0), yy < y + (thick > 1 ? 2 : 1) ? jit(PAL.black, 0.04) : vc());
    }
  }
  const zs = thick > 1 ? [z - 1, z] : [z];
  const ext = thick > 1 ? 2 : 1;
  // nuki
  for (let x = cx - half - ext; x <= cx + half + ext; x++) for (const zz of zs) g.set(x, y + h - (thick > 1 ? 7 : 4), zz, vc());
  // shimaki (large gates only) + kasagi

  for (const [dx, dz] of [[-2, -2], [2, -2], [-2, 2], [2, 2]]) { g.set(x + dx, y + 4, z + dz, br()); g.set(x + dx, y + 5, z + dz, br()); }
  for (let r = 3; r >= 0; r--) for (let dz = -r; dz <= r; dz++) for (let dx = -r; dx <= r; dx++) {
    if (r > 0 && Math.max(Math.abs(dx), Math.abs(dz)) !== r && r !== 0) continue;
    g.set(x + dx, y + 6 + (3 - r), z + dz, br());
  }
  g.set(x, y + 10, z, PAL.gold);
  ctx.smoke.push([x + 0.5, y + 5, z + 0.5]);
  g.lamps.push({ x: x + 0.5, y: y + 4, z: z + 0.5, r: 7, c: [1.0, 0.5, 0.2] });
}

function deer(ctx, x, z, facing, grazing, antlers) {
  const g = ctx.g;
  const y = ctx.ground(x, z) + 1;
  const o = orient(x, y, z, facing);
  const put = (f, u, s, c) => { const [a, b, cc] = o(f, u, s); g.set(a, b, cc, jit(c, 0.04)); };
  const body = 0xA8693D, belly = 0xD9B48A, leg = 0x7E4E2C, spot = 0xF6E7D2, dark = 0x2B211C;
  for (const f of [-2, 2]) for (const s of [0, 1]) for (let u = 0; u <= 2; u++) put(f, u, s, u === 0 ? dark : leg);
  for (let f = -3; f <= 2; f++) for (const s of [0, 1]) for (let u = 3; u <= 4; u++) {
    let c = u === 3 ? belly : body;
    if (u === 4 && rand() < 0.3) c = spot;
    put(f, u, s, c);
  }
  put(-4, 4, 0, 0xF4EDE2); put(-4, 4, 1, 0xF4EDE2);
  if (grazing) {
    put(3, 3, 0, body); put(3, 3, 1, body); put(4, 2, 0, body); put(4, 2, 1, body);
    put(5, 1, 0, body); put(5, 1, 1, body); put(5, 2, 0, body); put(5, 2, 1, body); put(6, 1, 0, dark); put(6, 1, 1, dark);
    put(4, 3, -1, body); put(4, 3, 2, body);
  } else {
    for (let u = 5; u <= 6; u++) { put(2, u, 0, body); put(2, u, 1, body); }
    for (let u = 6; u <= 7; u++) for (const f of [3, 4]) { put(f, u, 0, body); put(f, u, 1, body); }
    put(5, 6, 0, dark); put(5, 6, 1, dark);
    put(3, 8, -1, body); put(3, 8, 2, body);
    if (antlers) { put(3, 8, 0, 0xCDB58E); put(3, 9, 0, 0xCDB58E); put(3, 8, 1, 0xCDB58E); put(3, 9, 1, 0xCDB58E); put(3, 10, -1, 0xCDB58E); put(3, 10, 2, 0xCDB58E); put(2, 10, 0, 0xCDB58E); put(2, 10, 1, 0xCDB58E); }
  }
}

function stepStone(ctx, x, z, r = 1.5) {
  const g = ctx.g;
  const c = pick([0xB5B0A6, 0xA8A39A, 0xC2BDB2, 0x9F9A90]);
  for (let dz = -2; dz <= 2; dz++) for (let dx = -2; dx <= 2; dx++) {
    if (Math.hypot(dx * 0.95, dz * 1.1) > r + RR(-0.15, 0.15)) continue;
    const y = ctx.ground(x + dx, z + dz) + 1;
    g.set(x + dx, y, z + dz, jit(c, 0.04));
  }
}

    const r = RR(1.1, 2.1), notch = rand() * 6.28;
    for (let dz = -3; dz <= 3; dz++) for (let dx = -3; dx <= 3; dx++) {
      const d = Math.hypot(dx, dz); if (d > r) continue;
      const a = Math.atan2(dz, dx);

  for (let z = 1; z < SZ - 1; z++) for (let x = 1; x < SX - 1; x++) {

    if (!g.empty(x, h + 1, z)) continue;
    let carpet = false;
    for (const c of ctx.cherries) {
      const d = Math.hypot(x - c.x, z - c.z) / c.r;

      const d = Math.hypot(x - c.x, z - c.z) / c.r;
      if (d < 1 && rand() < c.p * (1 - d)) { g.set(x, h, z, jit(pick(c.pal), 0.05)); carpet = true; break; }
    }
    if (t !== T_GRASS || carpet) continue;
    const r = rand();

      if (rand() < 0.3) g.set(x, h + 2, z, jit(pick([0x6DB043, 0x86C855]), 0.06));

      if (rand() < 0.4) ctx.fireflies.push([x + 0.5, h + 3, z + 0.5]);
    }
  }
  for (let i = 0; i < 40; i++) {
    const ox = RR(8, 42), oz = RR(-3, 40);

}

// =============================================================================
//  Small grids: mini islands, koi, cranes, clouds
// =============================================================================
function miniIsland(seedN, R, item) {
  reseed(seedN);
  const size = Math.ceil(R * 2 + 14), sy = 44, top = 26;
  const g = new Grid(size, sy, size);
  const c = size / 2;
  const H = new Int16Array(size * size).fill(-1);
  for (let z = 0; z < size; z++) for (let x = 0; x < size; x++) {
    const dx = x + 0.5 - c, dz = z + 0.5 - c;
    const a = Math.atan2(dz, dx);
    const d = Math.hypot(dx, dz) / (R * (1 + 0.1 * Math.sin(3 * a + seedN) + 0.06 * Math.sin(5 * a)));
    if (d >= 1) continue;
    const depth = Math.round(3 + (1 - Math.pow(d, 1.4)) * R * 1.6 + (vnoise2(x * 0.3 + seedN, z * 0.3) - 0.5) * 5);
    const t = top + (d < 0.5 ? 1 : 0);
    H[z * size + x] = t;
    for (let y = Math.max(0, t - depth); y <= t; y++) {
      const dt = t - y;
      const col = dt === 0 ? grassColor(x * 3, z * 3) : dt <= 2 ? jit(pick(SOIL), 0.06) : strata(x + seedN, y, z);
      g.set(x, y, z, col);
    }
  }
  const ctx = {
    g, blossoms: [], cherries: [], leafCarpets: [], fireflies: [], smoke: [], koi: [], floatPetals: [],
    ground: (x, z) => { x = Math.floor(x); z = Math.floor(z); if (x < 0 || z < 0 || x >= size || z >= size) return top; const h = H[z * size + x]; return h < 0 ? top : h; },
  };
  const m = Math.floor(c);
  for (let z = 0; z < size; z++) for (let x = 0; x < size; x++) {
    const h = H[z * size + x];
    if (h >= 0 && rand() < 0.1 && g.empty(x, h + 1, z)) g.set(x, h + 1, z, jit(rand() < 0.4 ? pick([0xFFFFFF, 0xFF9EC0, 0xFFE066]) : 0x6DB043, 0.05));
  }
  if (item === 'cherry') cherryTree(ctx, m, m, { scale: 0.62, pal: SAKURA[1], trunk: 7, depth: 3 });
  if (item === 'lantern') { stoneLantern(ctx, m, m - 1); bush(ctx, m + 3, m + 2, 1.8, 'azalea'); bush(ctx, m - 3, m + 2, 1.6, 'azaleaWhite'); }
  if (item === 'pine') { pineTree(ctx, m, m, { scale: 0.62, h: 12 }); rock(ctx, m + 3.5, top + 1.5, m + 2.5, 1.6, 1.4, 1.4, 0.7); }
  if (item === 'torii') { torii(ctx, m, m, 3, 10, { thick: 1, y: top + 1 }); bush(ctx, m - 4, m + 3, 1.6, 'kerria'); }
  // vines
  for (let z = 1; z < size - 1; z++) for (let x = 1; x < size - 1; x++) {
    const h = H[z * size + x]; if (h < 0) continue;
    if (H[z * size + x + 1] >= 0 && H[z * size + x - 1] >= 0 && H[(z + 1) * size + x] >= 0 && H[(z - 1) * size + x] >= 0) continue;
    if (rand() < 0.25) for (let i = 1; i < RI(2, 8); i++) g.put(x, h - i, z, jit(rand() < 0.15 ? 0xF8A5C2 : 0x5FA040, 0.08));
  }
  return { g, ctx, origin: [c, top + 1, c] };
}

const KOI_PATTERNS = [
  { base: 0xF7F3EA, spot: 0xE2461F, spot2: null },    // kohaku
  { base: 0xF7F3EA, spot: 0xE2461F, spot2: 0x222222 }, // sanke
  { base: 0xF5B932, spot: 0xFFD866, spot2: null },    // ogon
  { base: 0xF57C1F, spot: 0xFFFFFF, spot2: null },    // orange & white
  { base: 0x222222, spot: 0xE2461F, spot2: 0xF7F3EA }, // showa
  { base: 0x8098B0, spot: 0xF07A2B, spot2: null },    // asagi
];
function koiGrids(kind, seedN) {
  reseed(seedN);
  const P = KOI_PATTERNS[kind % KOI_PATTERNS.length];
  const body = new Grid(11, 3, 5), tail = new Grid(4, 3, 5);
  for (let x = 0; x < 11; x++) for (let y = 0; y < 3; y++) for (let z = 0; z < 5; z++) {
    const t = x / 10;
    const w = 2.3 * Math.sin(Math.PI * clamp(0.12 + t * 0.95, 0, 1)) + 0.1, hh = 1.4 * Math.sin(Math.PI * clamp(0.1 + t * 0.95, 0, 1)) + 0.2;
    if (Math.abs(z - 2) > w - 0.5 || Math.abs(y - 1) > hh - 0.4) continue;
    let c = P.base;
    const n = vnoise3(x * 0.55 + seedN, y * 0.5, z * 0.55);
    if (n > 0.55) c = P.spot; else if (P.spot2 && n < 0.25) c = P.spot2;
    if (x === 10 && y === 1 && z === 2) c = 0xE8B0A0;
    g_set(body, x, y, z, c);
  }
  body.set(9, 2, 1, 0x111111); body.set(9, 2, 3, 0x111111);
  body.set(6, 0, 0, P.base); body.set(6, 0, 4, P.base);
  for (let x = 0; x < 4; x++) for (let z = 0; z < 5; z++) {
    const w = x * 0.75;
    if (Math.abs(z - 2) > w + 0.2) continue;
    if (x === 3 && z === 2) continue;
    tail.set(3 - x, 1, z, jit(x > 1 ? mixc(P.base, 0xFFFFFF, 0.3) : P.base, 0.04));
  }
  return { body, tail };
}
function g_set(g, x, y, z, c) { g.set(x, y, z, jit(c, 0.03)); }

function craneGrids() {
  reseed(77);
  const body = new Grid(26, 9, 7), wing = new Grid(10, 2, 16);
  const W_ = 0xF7F7F2, B_ = 0x262626;
  // body (length along +x)
  for (let x = 0; x < 26; x++) for (let y = 0; y < 9; y++) for (let z = 0; z < 7; z++) {
    const dx = (x + 0.5 - 10) / 5.5, dy = (y + 0.5 - 4) / 2.3, dz = (z + 0.5 - 3.5) / 2.3;
    if (dx * dx + dy * dy + dz * dz <= 1) body.set(x, y, z, jit(x < 7 ? 0x2E2E2E : W_, 0.02));

//  Mesher — face culling, per-vertex ambient occlusion, sky visibility,
//  baked lantern light. Produces typed arrays for an opaque and a water mesh.
// =============================================================================
function meshGrid(g, opt = {}) {

  const drop = opt.waterDrop ?? 0.22;

  const opq = (x, y, z) => {
    if (x < 0 || y < 0 || z < 0 || x >= sx || y >= sy || z >= sz) return 0;
    const m = d[(y * sz + z) * sx + x] >>> 24;
    return m !== 0 && m !== WATER ? 1 : 0;

  //     under a floating island lights its underside too) ---

    const i = (y * sz + z) * sx + x;

function waterGeometry(md) {
  const geo = new THREE.BufferGeometry();

  geo.setAttribute('aData', new THREE.BufferAttribute(md.data, 2, true));

}

// ---------- soft particle puffs (mist, incense smoke) ----------
function puffSystem(points, o) {
  const n = points.length;
  const pos = new Float32Array(n * 3), seed = new Float32Array(n);
  points.forEach((p, i) => { pos.set(p, i * 3); seed[i] = Math.random(); });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  const U = { uTime: { value: 0 }, uCol: { value: new THREE.Color(o.color) }, uAlpha: { value: o.alpha }, uPix: { value: renderer.getPixelRatio() }, uScale: { value: 1 } };
  const mat = new THREE.ShaderMaterial({
    uniforms: U, transparent: true, depthWrite: false,
    vertexShader: `attribute float aSeed; uniform float uTime, uPix, uScale; varying float vA;
void main(){
  float life = fract(uTime * ${o.rate.toFixed(3)} + aSeed);
  vec3 p = position + vec3(sin(aSeed * 40.0 + uTime * 0.7) * ${o.wobble.toFixed(2)} * life, ${o.rise.toFixed(2)} * life, cos(aSeed * 31.0 + uTime * 0.6) * ${o.wobble.toFixed(2)} * life);
  vec4 mv = modelViewMatrix * vec4(p, 1.0);

  gl_PointSize = mix(${o.s0.toFixed(1)}, ${o.s1.toFixed(1)}, life) * uPix * uScale * (300.0 / -mv.z);

    fragmentShader: `uniform vec3 uCol; uniform float uAlpha; varying float vA;
void main(){ float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.05, d); gl_FragColor = vec4(uCol, a * a * vA * uAlpha); }`,
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  return { pts, U };
}

function applyTime(h) {
  h = ((h % 24) + 24) % 24;
  let i = 0;
  while (i < TOD.length - 2 && TOD[i + 1].h <= h) i++;
  const a = TOD[i], b = TOD[i + 1];
  const t = (h - a.h) / (b.h - a.h || 1);
  for (const k of ['top', 'hor', 'bot', 'sun', 'hs', 'hg']) cur[k].lerpColors(a[k], b[k], t);
  for (const k of ['sunI', 'hI', 'glow', 'lamp', 'stars', 'flies', 'bloom']) cur[k] = a[k] + (b[k] - a[k]) * t;

  const p = (h - 6.0) / 12.6;
  const day = p > 0 && p < 1;
  if (day) {
    const el = Math.max(Math.sin(Math.PI * p) * 62, 3.5) * Math.PI / 180;
    const az = (120 - 200 * p) * Math.PI / 180;
    sunDir.set(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
  }
  const lightDir = day ? sunDir : moonDir;
  sun.position.copy(sun.target.position).addScaledVector(lightDir, 380);
  sun.color.copy(cur.sun);
  sun.intensity = cur.sunI;
  hemi.color.copy(cur.hs); hemi.groundColor.copy(cur.hg); hemi.intensity = cur.hI;
  fill.color.copy(cur.hg); fill.intensity = 0.15 + 0.75 * (1 - cur.stars);

  SKY.uTop.value.copy(cur.top); SKY.uHor.value.copy(cur.hor); SKY.uBot.value.copy(cur.bot);
  SKY.uSunDir.value.copy(sunDir); SKY.uSunCol.value.copy(cur.sun);
  SKY.uSunVis.value = day ? clamp(Math.sin(Math.PI * p) * 6, 0, 1) : 0;
  SKY.uMoonDir.value.copy(moonDir); SKY.uNight.value = cur.stars;
  scene.fog.color.copy(cur.hor);

  VU.uGlow.value = cur.glow; VU.uLamp.value = cur.lamp;
  STARU.uNight.value = cur.stars;
  FLY.uNight.value = cur.flies;
  WU.uSunDir.value.copy(lightDir);
  WU.uSunCol.value.copy(cur.sun).multiplyScalar(cur.sunI / Math.PI);
  WU.uAmb.value.copy(cur.hs).lerp(cur.hg, 0.3).multiplyScalar(cur.hI / Math.PI);

  cloudMat.color.setScalar(1 - 0.62 * cur.stars);

async function build() {

  });

  {

    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), c = new THREE.Color();

// ---------- petals ----------
function makePetals(blossoms) {
  const N = 900;
  const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.62, 0.09, 0.46), new THREE.MeshStandardMaterial({ roughness: 0.65, side: THREE.DoubleSide }), N);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

  const pos = new Float32Array(N * 3), vel = new Float32Array(N), rot = new Float32Array(N * 3), spin = new Float32Array(N * 3), ph = new Float32Array(N);
  const c = new THREE.Color();
  const cols = [0xffc1d6, 0xffb3c9, 0xffd6e5, 0xf7a1bf, 0xfff0f5, 0xf48fb1];
  const spawn = (i, anywhere) => {
    const b = blossoms[(Math.random() * blossoms.length) | 0];
    const r = b[3];
    pos[i * 3] = b[0] + (Math.random() - 0.5) * r * 1.6;
    pos[i * 3 + 1] = b[1] - r * 0.3 + (Math.random() - 0.5) * r - (anywhere ? Math.random() * 18 : 0);
    pos[i * 3 + 2] = b[2] + (Math.random() - 0.5) * r * 1.6;
    vel[i] = 0.9 + Math.random() * 1.0;
    for (let k = 0; k < 3; k++) { rot[i * 3 + k] = Math.random() * 6.28; spin[i * 3 + k] = (Math.random() - 0.5) * 4; }
    ph[i] = Math.random() * 6.28;
  };
  for (let i = 0; i < N; i++) { spawn(i, true); mesh.setColorAt(i, c.setHex(cols[i % cols.length])); }
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), v = new THREE.Vector3(), one = new THREE.Vector3(1, 1, 1);
  function update(dt, t) {
    const wx = 1.1 + Math.sin(t * 0.21) * 0.7, wz = 0.55 + Math.cos(t * 0.17) * 0.5;
    for (let i = 0; i < N; i++) {
      const o = i * 3;
      pos[o] += (wx + Math.sin(t * 1.3 + ph[i]) * 0.9) * dt;
      pos[o + 1] -= vel[i] * dt * (0.75 + 0.35 * Math.sin(t * 2.1 + ph[i]));
      pos[o + 2] += (wz + Math.cos(t * 1.1 + ph[i]) * 0.8) * dt;
      for (let k = 0; k < 3; k++) rot[o + k] += spin[o + k] * dt;
      const gx = Math.floor(pos[o]), gz = Math.floor(pos[o + 2]);
      let floor = -60;
      if (gx >= 0 && gz >= 0 && gx < SX && gz < SZ) floor = Math.max(floor, tops[gz * SX + gx]);
      if (pos[o + 1] < floor + 0.05) spawn(i, false);
      m4.compose(v.set(pos[o], pos[o + 1], pos[o + 2]), q.setFromEuler(e.set(rot[o], rot[o + 1], rot[o + 2])), one);
      mesh.setMatrixAt(i, m4);
    }
    mesh.instanceMatrix.needsUpdate = true;
  }
  return { mesh, update };
}

// ---------- butterflies (daytime): wings fold in the vertex shader ----------
function makeButterflies(spots) {
  const N = 34;
  const geo = new THREE.BoxGeometry(1.7, 0.06, 0.8, 2, 1, 1);
  const mat = new THREE.MeshLambertMaterial({ side: THREE.DoubleSide });
  const BU = { uTime: { value: 0 } };
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = BU.uTime;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nuniform float uTime;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
  float ph = float(gl_InstanceID) * 1.731;
  float a = (0.15 + 0.85 * (0.5 + 0.5 * sin(uTime * 17.0 + ph))) * 1.15 * sign(transformed.x);
  transformed.xy = vec2(transformed.x * cos(a) - transformed.y * sin(a), transformed.x * sin(a) + transformed.y * cos(a));`);
  };
  const mesh = new THREE.InstancedMesh(geo, mat, N);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false;
  const cols = [0xffd54f, 0xffffff, 0xff9800, 0x64b5f6, 0xf48fb1, 0xba68c8, 0xfff176];
  const homes = [], ph = [], c = new THREE.Color();
  for (let i = 0; i < N; i++) {
    homes.push(spots[(i * 7919) % spots.length]);
    ph.push(Math.random() * 100);
    mesh.setColorAt(i, c.setHex(cols[i % cols.length]));
  }
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0), one = new THREE.Vector3(1, 1, 1);
  function update(t, day) {
    BU.uTime.value = t;
    mesh.visible = day > 0.25;
    if (!mesh.visible) return;
    const sc = Math.min(1, (day - 0.25) * 3);
    for (let i = 0; i < N; i++) {
      const h = homes[i], p = ph[i], k = t * 0.55 + p;
      const x = h[0] + Math.sin(k) * 3.5 + Math.sin(k * 2.3) * 1.2, z = h[2] + Math.cos(k * 0.8) * 3.5 + Math.cos(k * 1.9) * 1.2;
      const y = h[1] + 0.5 + Math.sin(k * 1.7) * 1.3 + Math.abs(Math.sin(t * 6 + p)) * 0.35;
      const dx = Math.cos(k) * 3.5 + Math.cos(k * 2.3) * 2.76, dz = -Math.sin(k * 0.8) * 2.8 - Math.sin(k * 1.9) * 2.28;
      q.setFromAxisAngle(up, Math.atan2(dx, dz));
      m4.compose(v.set(x, y, z), q, one.setScalar(sc));
      mesh.setMatrixAt(i, m4);
    }
    mesh.instanceMatrix.needsUpdate = true;
  }
  return { mesh, update };
}

// =============================================================================
//  Animation loop
// =============================================================================
const clock = new THREE.Clock();
const intro = { t: 0, dur: 5.5, active: true, from: new THREE.Spherical(760, 0.62, -0.9), to: new THREE.Spherical(390, 1.12, 0.62) };
const sph = new THREE.Spherical();
function fitDistance() { const a = camera.aspect; return a < 1 ? 390 * Math.min(1.9, 1.15 / a) : 390; }
function easeInOut(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  if (state.cycle) state.time = (state.time + dt * 0.4) % 24;
  else if (state.targetTime !== null) {
    let d = state.targetTime - state.time;
    if (d < 0) d += 24;
    const step = Math.max(dt * 6, d * dt * 2.2);
    if (d <= step || d < 0.01) { state.time = state.targetTime; state.targetTime = null; }
    else state.time = (state.time + step) % 24;
  }
  applyTime(state.time);
  updateClockUI();

  if (intro.active) {
    intro.t += dt;
    const k = easeInOut(Math.min(1, intro.t / intro.dur));
    sph.radius = lerp(intro.from.radius, fitDistance(), k);
    sph.phi = lerp(intro.from.phi, intro.to.phi, k);
    sph.theta = lerp(intro.from.theta, intro.to.theta, k);
    camera.position.setFromSpherical(sph).add(TARGET);
    camera.lookAt(TARGET);
    if (intro.t >= intro.dur) { intro.active = false; controls.enabled = true; }
  } else controls.update();

  if (petalSys) { petalSys.mesh.visible = state.petals; if (state.petals) petalSys.update(dt, t); }
  if (butterflies) butterflies.update(t, 1 - cur.stars - cur.glow * 0.25);
  for (const k of koiList) {
    const u = k.userData;
    const a = u.ph + t * u.sp;
    const x = u.cx + Math.cos(a) * u.rx, z = u.cz + Math.sin(a) * u.rz;
    const dx = -Math.sin(a) * u.rx * Math.sign(u.sp), dz = Math.cos(a) * u.rz * Math.sign(u.sp);
    k.position.set(x, G - 1.25 + Math.sin(t * 0.7 + u.ph) * 0.12, z);
    k.rotation.y = -Math.atan2(dz, dx) + Math.sin(t * 5 + u.ph) * 0.08;
    u.tail.rotation.y = Math.sin(t * 7 + u.ph) * 0.45;
  }
  for (const c of craneList) {
    const u = c.userData;
    const a = u.ph + t * u.sp;
    c.position.set(Math.cos(a) * u.r, u.y + Math.sin(t * 0.5 + u.ph) * 5, Math.sin(a) * u.r);
    c.rotation.set(0, -a - Math.PI / 2 * Math.sign(u.sp), 0);
    c.rotateX(-0.22);
    const flap = Math.sin(t * 2.6 + u.ph);
    u.pivotL.rotation.x = -flap * 0.55 - 0.05;
    u.pivotR.rotation.x = flap * 0.55 + 0.05;
  }
  if (cloudGroup) {
    cloudGroup.rotation.y += dt * 0.008;
    for (const m of cloudGroup.children) m.position.y += Math.sin(t * 0.3 + m.userData.bob) * 0.01;
  }
  for (const m of minis) {
    m.position.y = m.userData.base + Math.sin(t * 0.55 + m.userData.ph) * 2.2;
    m.rotation.y += m.userData.spin * dt;
  }
  WU.uTime.value = t; FLY.uTime.value = t; STARU.uTime.value = t;
  for (const p of puffs) p.U.uTime.value = t;
  sky.position.copy(camera.position);
  stars.position.copy(camera.position);
  composer.render();
  adaptResolution(dt);
  requestAnimationFrame(tick);
}

// keep things smooth on slower GPUs: step the render resolution down if frames are slow
const perf = { t: 0, frames: 0, settled: false };
function adaptResolution(dt) {
  if (perf.settled || intro.active) return;
  perf.t += dt; perf.frames++;
  if (perf.t < 2.5) return;
  const fps = perf.frames / perf.t;
  perf.t = 0; perf.frames = 0;
  if (fps < 40 && pixelRatio > 1) {
    pixelRatio = Math.max(1, pixelRatio - 0.5);
    renderer.setPixelRatio(pixelRatio);
    composer.setPixelRatio(pixelRatio);
    composer.setSize(window.innerWidth, window.innerHeight);
    for (const u of [STARU, FLY, ...puffs.map((p) => p.U)]) u.uPix.value = pixelRatio;
  } else perf.settled = true;
}

// =============================================================================
//  UI
// =============================================================================
function fmtTime(h) { const hh = Math.floor(h), mm = Math.floor((h - hh) * 60); return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0'); }
const slider = $('time');
let lastShown = -1;
function updateClockUI() {
  if (Math.abs(lastShown - state.time) < 0.005) return;
  lastShown = state.time;
  slider.value = state.time;
  $('clock').textContent = fmtTime(state.time);
  const h = state.time;
  document.querySelectorAll('#tod button').forEach((b) => {
    const bh = +b.dataset.h;
    let d = Math.abs(h - bh); d = Math.min(d, 24 - d);
    b.classList.toggle('on', d < 1.2);
  });
}
slider.addEventListener('input', () => { state.time = +slider.value; state.targetTime = null; setCycle(false); });
document.querySelectorAll('#tod button').forEach((b) => b.addEventListener('click', () => { setCycle(false); state.targetTime = +b.dataset.h; }));
function setToggle(id, on) { $(id).classList.toggle('on', on); $(id).setAttribute('aria-pressed', on); }
function setCycle(on) { state.cycle = on; setToggle('t-cycle', on); }
function setRotate(on) { state.rotate = on; controls.autoRotate = on; setToggle('t-rotate', on); }
function setPetals(on) { state.petals = on; setToggle('t-petals', on); }
$('t-rotate').addEventListener('click', () => setRotate(!state.rotate));
$('t-petals').addEventListener('click', () => setPetals(!state.petals));
$('t-cycle').addEventListener('click', () => { setCycle(!state.cycle); state.targetTime = null; });
let resumeTimer = 0;
controls.addEventListener('start', () => { clearTimeout(resumeTimer); controls.autoRotate = false; });
controls.addEventListener('end', () => { clearTimeout(resumeTimer); resumeTimer = setTimeout(() => { controls.autoRotate = state.rotate; }, 5000); });
renderer.domElement.addEventListener('pointerdown', () => { if (intro.active) { intro.active = false; controls.enabled = true; } });
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' && e.key !== 'h') return;
  const presets = { 1: 6.5, 2: 12, 3: 17.6, 4: 21.5 };
  if (presets[e.key] !== undefined) { setCycle(false); state.targetTime = presets[e.key]; }
  else if (e.key === 'r') setRotate(!state.rotate);
  else if (e.key === 'p') setPetals(!state.petals);
  else if (e.key === 'c') setCycle(!state.cycle);
  else if (e.key === 'h') { state.ui = !state.ui; document.body.classList.toggle('hide-ui', !state.ui); }
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloom.resolution.set(window.innerWidth, window.innerHeight);
});

// hooks for automated screenshots
window.__pagoda = {
  ready: false,
  setTime(h) { state.time = h; state.targetTime = null; applyTime(h); },
  view(theta, phi, radius, ty = TARGET.y, tx = 0, tz = 0) {
    intro.active = false; controls.enabled = true; controls.autoRotate = false; state.rotate = false;
    controls.target.set(tx, ty, tz);
    camera.position.setFromSpherical(new THREE.Spherical(radius, phi, theta)).add(controls.target);
    controls.update();
  },
};

// =============================================================================
//  Go
// =============================================================================
(async () => {
  try {
    camera.position.setFromSpherical(intro.from).add(TARGET);
    camera.lookAt(TARGET);
    applyTime(state.time);
    await build();
    applyTime(state.time);
    document.body.classList.add('ready');
    setTimeout(() => $('loader').remove(), 1600);
    clock.start();
    window.__pagoda.ready = true;
    tick();
  } catch (err) {
    console.error(err);
    $('load-msg').textContent = 'Something went wrong: ' + err.message;
  }
})();

</script>
