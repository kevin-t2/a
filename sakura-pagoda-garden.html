<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =====================================================================
   Deterministic randomness + noise
   ===================================================================== */
let _s = 20240417;
function rand() { _s |= 0; _s = (_s + 0x6D2B79F5) | 0; let t = Math.imul(_s ^ (_s >>> 15), 1 | _s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const rr = (a, b) => a + rand() * (b - a);
const ri = (a, b) => Math.floor(a + rand() * (b - a + 1));
const pick = (a) => a[Math.floor(rand() * a.length)];
function hash2(x, z) { let h = (Math.imul(x | 0, 374761393) + Math.imul(z | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
const hash3 = (x, y, z) => hash2(x * 7 + y * 131, z * 13 - y * 57);

/* =====================================================================

   ===================================================================== */
const cl = (v) => Math.max(0, Math.min(255, Math.round(v)));
const rgb = (h) => [(h >> 16) & 255, (h >> 8) & 255, h & 255];

const css = (h) => '#' + h.toString(16).padStart(6, '0');

const PINKS = [0xffb7c9, 0xffc4d6, 0xf9a8c4, 0xff9dbb, 0xffd3e1, 0xfbe3ea, 0xf28db2, 0xffaccc];
const PINKS2 = [0xff8fb3, 0xf77fa8, 0xffa6c4, 0xff99bb, 0xffc1d5, 0xe86f9e, 0xffb0cb];
const MAPLE_RED = [0xc0392b, 0xd64532, 0xe25a3a, 0xa82a22, 0xe8743b, 0xb5302a];
const MAPLE_ORANGE = [0xe67e22, 0xf39c12, 0xf5b041, 0xd35400, 0xeb984e, 0xf7c04a];
const FLOWERS = [0xff5a6e, 0xffd23f, 0xffffff, 0x9b6bff, 0xff8c42, 0xff7eb6, 0x6fa8ff, 0xfff27a];
const RED = 0xc7372f, RED_D = 0x9a2620, WOOD = 0x5b3a26, WOOD_D = 0x38251a, GOLD = 0xe3b341, WHITE = 0xf3ead6;
const ROOF = 0x3a4757, ROOF_L = 0x4d5e73, ROOF_D = 0x252e39;
const N4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];

/* =====================================================================
   Voxel store
   ===================================================================== */
const SOLID = 0, WATER = 1, GLOW = 2;
const K = (x, y, z) => (x + 128) * 65536 + (y + 64) * 256 + (z + 128);
function makeStore() {
  const m = new Map();
  return {
    m,
    set(x, y, z, c, t = SOLID) { m.set(K(Math.round(x), Math.round(y), Math.round(z)), c * 4 + t); },
    put(x, y, z, c, t = SOLID) { const k = K(Math.round(x), Math.round(y), Math.round(z)); if (!m.has(k)) m.set(k, c * 4 + t); },
    has(x, y, z) { return m.has(K(Math.round(x), Math.round(y), Math.round(z))); },
    get(x, y, z) { return m.get(K(Math.round(x), Math.round(y), Math.round(z))); },
  };
}
const S = makeStore();   // the world
const C = makeStore();   // clouds
let TGT = S;
const setV = (x, y, z, c, t) => TGT.set(x, y, z, c, t);
const putV = (x, y, z, c, t) => TGT.put(x, y, z, c, t);

function line(a, b, r, cf) {
  const L = Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]), n = Math.max(1, Math.ceil(L * 2)), R = Math.ceil(r);
  for (let i = 0; i <= n; i++) {
    const t = i / n, px = Math.round(a[0] + (b[0] - a[0]) * t), py = Math.round(a[1] + (b[1] - a[1]) * t), pz = Math.round(a[2] + (b[2] - a[2]) * t);
    for (let ox = -R; ox <= R; ox++) for (let oy = -R; oy <= R; oy++) for (let oz = -R; oz <= R; oz++)
      if (ox * ox + oy * oy + oz * oz <= r * r + 0.25) putV(px + ox, py + oy, pz + oz, cf());
  }
}
function blob(cx, cy, cz, rx, ry, rz, cf, dens = 1, rough = 0.35, t = SOLID) {
  for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx + 1); x++)
    for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry + 1); y++)
      for (let z = Math.floor(cz - rz - 1); z <= Math.ceil(cz + rz + 1); z++) {
        const dx = (x - cx) / rx, dy = (y - cy) / ry, dz = (z - cz) / rz, q = dx * dx + dy * dy + dz * dz;
        if (q > 1 + (hash3(x, y, z) - 0.5) * rough) continue;
        if (dens < 1 && rand() > dens) continue;
        putV(x, y, z, cf(x, y, z, q), t);
      }
}

/* =====================================================================
   Terrain columns
   ===================================================================== */
const E = 62, W2 = 2 * E + 1;
const ci = (x, z) => (x + E) * W2 + (z + E);
const inB = (x, z) => x >= -E && x <= E && z >= -E && z <= E;
const colH = new Int16Array(W2 * W2).fill(-999);
const colT = new Uint8Array(W2 * W2);
const colB = new Int16Array(W2 * W2);
const pathAl = new Float32Array(W2 * W2).fill(-1);
const pathD = new Float32Array(W2 * W2).fill(9);
const T_GRASS = 1, T_PATH = 2, T_GRAVEL = 3, T_SAND = 4, T_POND = 5, T_STREAM = 6;
const H = (x, z) => inB(x, z) ? colH[ci(x, z)] : -999;
const TT = (x, z) => inB(x, z) ? colT[ci(x, z)] : 0;
function flat(x, z, h, t) { if (H(x, z) === -999) return; const i = ci(x, z); colH[i] = h; colT[i] = t; }

function polyDist(px, pz, pts) {
  let best = 1e9, along = 0, acc = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const [ax, az] = pts[i], [bx, bz] = pts[i + 1], dx = bx - ax, dz = bz - az, L2 = dx * dx + dz * dz, L = Math.sqrt(L2);
    const t = Math.max(0, Math.min(1, ((px - ax) * dx + (pz - az) * dz) / L2));
    const d = Math.hypot(px - ax - t * dx, pz - az - t * dz);
    if (d < best) { best = d; along = acc + t * L; }
    acc += L;
  }
  return [best, along];
}
function polyAt(pts, a) {
  for (let i = 0; i < pts.length - 1; i++) {
    const [ax, az] = pts[i], [bx, bz] = pts[i + 1], L = Math.hypot(bx - ax, bz - az);
    if (a <= L) return [ax + (bx - ax) * a / L, az + (bz - az) * a / L];
    a -= L;
  }
  return pts[pts.length - 1];
}
const polyLen = (pts) => { let s = 0; for (let i = 0; i < pts.length - 1; i++) s += Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]); return s; };

const PAGODA = [14, -10];
const POND = [-17, 12];
const PATHS = [[[6, 52], [6, 22], [14, 10], [14, 1]], [[6, 12], [-4, 12]], [[-30, 12], [-34, 8]]];
const CASCADE = [[-28, -24], [-25, -14], [-22, -5], [-19, 3]];
const SD = [-1 / Math.hypot(1, 0.45), 0.45 / Math.hypot(1, 0.45)], PERP = [SD[1], -SD[0]];
const ROCKS = [[22, 12, 2.4], [28, 18, 3.0], [23, 21, 1.7], [31, 11, 1.5]];
const pondE = (x, z) => { const a = (x - POND[0]) / 11.5, b = (z - POND[1]) / 8.5; return a * a + b * b - (noise2(x * 0.22 + 40, z * 0.22 + 40) - 0.5) * 0.55; };
let FALL_EDGE = null;

function shapeTerrain() {
  for (let x = -E; x <= E; x++) for (let z = -E; z <= E; z++) {
    const d = Math.hypot(x, z), a = Math.atan2(z, x);
    const r = 48 + (noise2(Math.cos(a) * 1.7 + 20, Math.sin(a) * 1.7 + 20) - 0.5) * 10;
    if (d >= r) continue;
    let h = 5 + (fbm(x * 0.07 + 3, z * 0.07 + 9) - 0.5) * 2.4;
    const d1 = Math.hypot(x + 28, z + 26); if (d1 < 21) h += 20 * Math.pow(1 - d1 / 21, 1.25);
    const d2 = Math.hypot(x + 8, z + 38); if (d2 < 13) h += 8 * Math.pow(1 - d2 / 13, 1.4);
    if (d > r - 2.2) h -= 1;
    const i = ci(x, z);
    colH[i] = Math.round(h); colT[i] = T_GRASS;
    colB[i] = Math.round(-2 - Math.pow(1 - d / r, 0.65) * 30 - noise2(x * 0.18 + 50, z * 0.18 + 50) * 7);
  }
  // pagoda courtyard, rock garden, gazebo lawn
  for (let x = 1; x <= 27; x++) for (let z = -23; z <= 3; z++) flat(x, z, 5, T_GRAVEL);
  for (let x = 18; x <= 34; x++) for (let z = 8; z <= 24; z++) flat(x, z, 5, T_SAND);
  for (let x = -41; x <= -31; x++) for (let z = -1; z <= 9; z++) flat(x, z, 5, T_GRASS);
  // garden paths
  for (let x = -E; x <= E; x++) for (let z = -E; z <= E; z++) {
    if (H(x, z) === -999) continue;
    for (const P of PATHS) {
      const [d, al] = polyDist(x, z, P);
      if (d <= 2.4) { flat(x, z, 5, T_PATH); const i = ci(x, z); if (d < pathD[i]) { pathD[i] = d; pathAl[i] = al; } }
    }
  }
  // koi pond
  for (let x = -32; x <= -2; x++) for (let z = 0; z <= 24; z++) {
    if (H(x, z) === -999) continue;
    const e = pondE(x, z);
    if (e < 1) flat(x, z, 4 - (1 + Math.round(2.2 * (1 - e))), T_POND);
  }
  // stream flowing west off the island's edge
  for (let s = 0; s < 70; s += 0.25) {
    const px = -25.5 + SD[0] * s, pz = 16.5 + SD[1] * s;
    if (s > 2 && H(Math.round(px), Math.round(pz)) === -999) { FALL_EDGE = [px, pz]; break; }
    for (let k = -1.5; k <= 1.5; k += 0.5) {
      const x = Math.round(px + PERP[0] * k), z = Math.round(pz + PERP[1] * k);
      if (H(x, z) === -999 || TT(x, z) === T_POND) continue;
      flat(x, z, 4, T_STREAM);
    }
  }
  // cascade tumbling down the hill into the pond (monotone profile)
  const prof = []; let run = 999;
  for (let a = 0; a <= polyLen(CASCADE) + 0.5; a += 0.5) {
    const [px, pz] = polyAt(CASCADE, a), x = Math.round(px), z = Math.round(pz);
    let h = H(x, z); if (TT(x, z) === T_POND) h = 4;
    run = Math.min(run, Math.max(4, h)); prof.push(run);
  }
  for (let x = -34; x <= -12; x++) for (let z = -30; z <= 6; z++) {
    if (H(x, z) === -999 || TT(x, z) === T_POND) continue;
    const [d, al] = polyDist(x, z, CASCADE);
    if (Math.hypot(x + 28, z + 24) <= 2.4) flat(x, z, prof[0], T_STREAM);
    else if (d <= 1.6) flat(x, z, Math.max(5, prof[Math.min(prof.length - 1, Math.round(al / 0.5))]), T_STREAM);

const surf = (x, z) => { const t = TT(x, z); return t === T_POND ? 4 : t === T_STREAM ? H(x, z) : null; };
function topColor(x, z, T, h, sl) {
  switch (T) {
    case T_GRASS: {

      let c = mix(0x4f8a34, 0x8cc24f, noise2(x * 0.11 + 7, z * 0.11 + 3));
      if (h > 12) c = mix(c, 0x3f6f35, 0.35);
      return jit(c, 0.07);
    }
    case T_PATH: {
      const i = ci(x, z), d = pathD[i], al = pathAl[i];
      if (d < 1.6 && (al % 3.4) < 2.2) return jit(pick([0x9d978b, 0xa9a397, 0x8f8a80]), 0.04);
      return d > 2.0 ? jit(0xbcb197, 0.05) : jit(0xd6caa9, 0.05);

    case T_POND: return jit(pick([0x8b8466, 0x6f7756, 0x9a9070, 0x5f6b4c]));
    case T_STREAM: {
      for (const [dx, dz] of N4) { const s = surf(x + dx, z + dz); if (s !== null && s <= h - 2) return jit(0xeaf6ff, 0.03); }

const STONES = [0x6e6258, 0x84766a, 0x5c5149, 0x766a5e];
function fillTerrain() {
  for (let x = -E; x <= E; x++) for (let z = -E; z <= E; z++) {
    const i = ci(x, z), h = colH[i]; if (h === -999) continue;
    const T = colT[i], b = colB[i];
    let sl = 0; for (const [dx, dz] of N4) { const hn = H(x + dx, z + dz); if (hn !== -999) sl = Math.max(sl, h - hn); }
    for (let y = b; y <= h; y++) {
      const depth = h - y; let c, t = SOLID;
      if (depth === 0) { c = topColor(x, z, T, h, sl); if (T === T_STREAM) t = WATER; }
      else if (T === T_STREAM && depth === 1) c = jit(0x5f6b6e);
      else if (depth <= 3 && T !== T_POND && !(sl >= 3 && h > 7)) c = depth === 1 ? jit(0x6b4a2c) : jit(mix(0x7a5232, 0x5e3d25, depth / 3));
      else c = jit(STONES[((Math.floor((y + noise2(x * 0.15, z * 0.15) * 5) / 3) % 4) + 4) % 4], 0.05);
      S.set(x, y, z, c, t);
    }
    if (T === T_POND) {
      let foam = false;
      for (const [dx, dz] of N4) { const s = surf(x + dx, z + dz); if (TT(x + dx, z + dz) === T_STREAM && s >= 6) foam = true; }

    const [ex, ez] = FALL_EDGE;

      const o = (4 - y) * 0.07;
      const x = Math.round(ex + SD[0] * o + PERP[0] * k), z = Math.round(ez + SD[1] * o + PERP[1] * k);

  for (let x = -E; x <= E; x++) for (let z = -E; z <= E; z++) {
    const h = H(x, z); if (h === -999 || TT(x, z) === T_STREAM) continue;
    for (const [dx, dz] of N4) {
      if (H(x + dx, z + dz) !== -999 || rand() > 0.11) continue;
      const len = ri(2, 8), vc = pick([0x3f7d3a, 0x4d8f43, 0x2f6a35]);
      for (let j = 1; j <= len; j++) S.put(x + dx, h - j + 1, z + dz, jit(vc));
      if (rand() < 0.35) S.put(x + dx, h - len, z + dz, jit(pick([0xff8fb8, 0xffffff, 0xb08be0])));
    }
    if (rand() < 0.012) { const b = colB[ci(x, z)]; const len = ri(2, 6); for (let j = 1; j <= len; j++) S.put(x + (j > 3 ? 1 : 0), b - j, z, jit(0x5a3b26)); }
  }

/* =====================================================================
   Architecture
   ===================================================================== */
const LIGHTS = [];
function pagoda(cx, cz) {
  const stone = () => jit(pick([0x9c968a, 0xa8a296, 0x8f897e]), 0.04);
  for (let dx = -9; dx <= 9; dx++) for (let dz = -9; dz <= 9; dz++) {
    const edge = Math.abs(dx) === 9 || Math.abs(dz) === 9;
    S.set(cx + dx, 6, cz + dz, stone());
    S.set(cx + dx, 7, cz + dz, edge ? jit(0xb9b3a6, 0.03) : jit(((dx + dz) & 1) ? 0xb8b2a6 : 0xa9a397, 0.02));
  }
  for (let k = -2; k <= 2; k++) { S.set(cx + k, 6, cz + 10, stone()); S.set(cx + k, 6, cz - 10, stone()); S.set(cx + 10, 6, cz + k, stone()); S.set(cx - 10, 6, cz + k, stone()); }
  let y0 = 8;
  for (let i = 0; i < 5; i++) {
    const w = 6 - i, Hh = i === 0 ? 5 : 4;
    for (let dx = -w - 1; dx <= w + 1; dx++) for (let dz = -w - 1; dz <= w + 1; dz++) S.set(cx + dx, y0, cz + dz, i === 0 ? jit(0xb3ad9f, 0.03) : jit(WOOD, 0.05));

  bloom.strength = lerp(0.22, 0.8, n);
  bloom.threshold = lerp(1.35, 0.95, n);
  stars.material.opacity = n; moon.material.opacity = n; moon.visible = n > 0.01;
  for (const L of pointLights) L.intensity = 38 * n;
  flies.visible = n > 0.05;
  for (const b of butterflies) b.g.visible = n < 0.5;
  renderer.toneMappingExposure = lerp(1.0, 1.2, n);
}

/* =====================================================================
   Boot
   ===================================================================== */
const composer = new EffectComposer(renderer);
composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.22, 0.6, 1.35);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function boot() {
  buildGarden();
  const [sl, wl, gl] = meshesFrom(S);
  scene.add(instanced(sl, solidMat, true, true));
  scene.add(instanced(wl, waterMat, false, true));
  scene.add(instanced(gl, glowMat, false, false));
  const [cs] = meshesFrom(C);
  cloudGroup = new THREE.Group();
  const clouds = instanced(cs, cloudMat, true, false);
  cloudGroup.add(clouds); scene.add(cloudGroup);
  for (const [x, y, z] of LIGHTS.slice(0, 10)) {
    const L = new THREE.PointLight(0xffb45a, 0, 20, 2); L.position.set(x, y, z); scene.add(L); pointLights.push(L);
  }
  buildLife();
  applyTime(0);
  console.log('voxels:', sl.length / 5 + wl.length / 5 + gl.length / 5, 'visible of', S.m.size);
  const ld = document.getElementById('loading'); ld.style.opacity = 0; setTimeout(() => ld.remove(), 1000);
  renderer.setAnimationLoop(frame);
}

const clock = new THREE.Clock(); let time = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05); time += dt;
  nightT += (nightTarget - nightT) * Math.min(1, dt * 1.6);
  if (Math.abs(nightT - lastApplied) > 0.002) { applyTime(nightT); lastApplied = nightT; }
  controls.update();
  updateLife(dt, time);
  composer.render();
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); bloom.setSize(innerWidth, innerHeight);
});
const bN = document.getElementById('bNight'), bR = document.getElementById('bRot'), bP = document.getElementById('bPetal');
const toggleNight = () => { nightTarget = nightTarget ? 0 : 1; bN.classList.toggle('on', !!nightTarget); bN.textContent = nightTarget ? '☀️ Day' : '🌙 Night'; };
const toggleRot = () => { controls.autoRotate = !controls.autoRotate; bR.classList.toggle('on', controls.autoRotate); };
const togglePetals = () => { petals.visible = !petals.visible; bP.classList.toggle('on', petals.visible); };
bN.onclick = toggleNight; bR.onclick = toggleRot; bP.onclick = togglePetals;
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'n') toggleNight(); else if (k === 'r') toggleRot(); else if (k === 'p') togglePetals();
});

setTimeout(boot, 60);
</script>
</body>
</html>
